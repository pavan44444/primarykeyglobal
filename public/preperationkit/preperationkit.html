<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Kits - PRIMARY KEY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="../assets/sidebar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            transition: all 0.3s ease;
            margin-bottom: 40px;
            font-size: 14px;
            font-weight: 600;
        }

        .back-button:hover {
            border-color: #0284c7;
            transform: translateX(-5px);
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 30px;
            background: rgba(2, 132, 199, 0.2);
            border: 1px solid rgba(2, 132, 199, 0.4);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(40px, 7vw, 64px);
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9, #06b6d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .page-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Controls Bar */
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease 0.2s backwards;
            flex-wrap: wrap;
        }

        .search-wrapper {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: var(--text-muted);
            pointer-events: none;
        }

        .search-input {
            width: 100%;
            padding: 16px 20px 16px 56px;
            border-radius: 12px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--input-focus-border);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .sort-select {
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            min-width: 200px;
        }

        .sort-select:focus {
            outline: none;
            border-color: var(--input-focus-border);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        .results-count {
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Kits Grid */
        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 28px;
            animation: fadeInUp 0.8s ease 0.4s backwards;
        }

        .kit-card {
            padding: 32px 28px;
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            animation: slideUp 0.6s ease backwards;
        }

        .kit-card:nth-child(1) { animation-delay: 0.5s; }
        .kit-card:nth-child(2) { animation-delay: 0.6s; }
        .kit-card:nth-child(3) { animation-delay: 0.7s; }
        .kit-card:nth-child(4) { animation-delay: 0.8s; }
        .kit-card:nth-child(5) { animation-delay: 0.9s; }
        .kit-card:nth-child(6) { animation-delay: 1s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .kit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(2, 132, 199, 0.05), rgba(6, 182, 212, 0.05));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .kit-card:hover::before {
            opacity: 1;
        }

        .kit-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0284c7, #0ea5e9, #06b6d4);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .kit-card:hover::after {
            transform: scaleX(1);
        }

        .kit-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 24px 64px rgba(2, 132, 199, 0.3);
        }

        .kit-icon {
            width: 70px;
            height: 70px;
            background: var(--btn-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            margin-bottom: 24px;
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
            transition: all 0.4s ease;
        }

        .kit-card:hover .kit-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        .company-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .kit-meta {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
            padding: 16px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 12px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .meta-icon {
            font-size: 18px;
        }

        .download-btn {
            width: 100%;
            padding: 16px 24px;
            background: var(--btn-gradient);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .download-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .download-btn:hover::before {
            left: 100%;
        }

        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(2, 132, 199, 0.4);
        }

        .download-icon {
            font-size: 20px;
            transition: transform 0.3s ease;
        }

        .download-btn:hover .download-icon {
            transform: translateY(3px);
        }

        /* Loading & Error States */
        .loading, .error, .no-results {
            text-align: center;
            padding: 80px 40px;
            border-radius: 24px;
            animation: fadeInUp 0.8s ease;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid #0284c7;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: var(--error-bg);
            border: 2px solid var(--error-border);
        }

        .error h3 {
            color: var(--error-text);
            font-size: 28px;
            margin-bottom: 16px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .no-results {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
        }

        .no-results-icon {
            font-size: 80px;
            margin-bottom: 24px;
            opacity: 0.5;
        }

        .no-results h3 {
            font-size: 28px;
            margin-bottom: 16px;
            color: var(--text-primary);
            font-family: 'Space Grotesk', sans-serif;
        }

        .no-results p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 20px 60px;
            }

            .controls-bar {
                flex-direction: column;
            }

            .search-wrapper {
                max-width: 100%;
            }

            .sort-select {
                width: 100%;
            }

            .kits-grid {
                grid-template-columns: 1fr;
            }

            .kit-meta {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .page-title {
                font-size: 40px;
                letter-spacing: -1px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../dashboard/dashboard.html" class="back-button">
            ← Back to Dashboard
        </a>

        <div class="header">
            <div class="header-badge">
                <span>📚</span>
                <span>Study Resources</span>
            </div>
            <h1 class="page-title">Preparation Kits</h1>
            <p class="page-subtitle">Access comprehensive study materials and preparation resources for top companies</p>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar">
            <div class="search-wrapper">
                <span class="search-icon">🔍</span>
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="Search by company name..."
                    autocomplete="off"
                >
            </div>
            <select id="sortSelect" class="sort-select">
                <option value="newest">📅 Newest First</option>
                <option value="oldest">📅 Oldest First</option>
                <option value="name-asc">🔤 Company (A-Z)</option>
                <option value="name-desc">🔤 Company (Z-A)</option>
            </select>
        </div>

        <div class="results-count" id="resultsCount"></div>

        <!-- Kits Container -->
        <div id="kitsContainer">
            <div class="loading glass">
                <div class="loading-spinner"></div>
                <p style="color: var(--text-secondary); font-size: 18px; font-weight: 600;">Loading preparation kits...</p>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = "http://localhost:5000/api";
      //  const API_BASE_URL = "https://primarykey-production-6114.up.railway.app/api";
        const token = localStorage.getItem('authToken');
        const loggedInCollegeId = localStorage.getItem('collegeId');
        
        let allKits = [];
        let filteredKits = [];

        const kitsContainer = document.getElementById('kitsContainer');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const resultsCount = document.getElementById('resultsCount');

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        }

        function showError(message) {
            kitsContainer.innerHTML = `
                <div class="error glass">
                    <h3>⚠️ Error</h3>
                    <p style="color: var(--text-secondary); font-size: 16px;">${message}</p>
                </div>
            `;
        }

        function showNoResults(searchTerm = '') {
            const message = searchTerm 
                ? `No preparation kits found for "${searchTerm}"`
                : 'No preparation kits available for your college yet';
            
            kitsContainer.innerHTML = `
                <div class="no-results glass">
                    <div class="no-results-icon">📭</div>
                    <h3>${message}</h3>
                    <p>${searchTerm ? 'Try a different search term' : 'Check back later for new resources'}</p>
                </div>
            `;
        }

        function updateResultsCount() {
            if (filteredKits.length === 0) {
                resultsCount.textContent = '';
            } else {
                resultsCount.textContent = `Showing ${filteredKits.length} preparation kit${filteredKits.length !== 1 ? 's' : ''}`;
            }
        }

        function sortKits(kits, sortType) {
            const sorted = [...kits];
            
            switch(sortType) {
                case 'newest':
                    sorted.sort((a, b) => new Date(b.date_added || b.created_at) - new Date(a.date_added || a.created_at));
                    break;
                case 'oldest':
                    sorted.sort((a, b) => new Date(a.date_added || a.created_at) - new Date(b.date_added || b.created_at));
                    break;
                case 'name-asc':
                    sorted.sort((a, b) => a.company.localeCompare(b.company));
                    break;
                case 'name-desc':
                    sorted.sort((a, b) => b.company.localeCompare(a.company));
                    break;
            }
            
            return sorted;
        }

        function renderKits(kits) {
            if (kits.length === 0) {
                showNoResults(searchInput.value.trim());
                updateResultsCount();
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'kits-grid';

            kits.forEach((kit, index) => {
                const card = document.createElement('div');
                card.className = 'kit-card glass';

                card.innerHTML = `
                    <div class="kit-icon">📄</div>
                    <h2 class="company-name">${kit.company}</h2>
                    <div class="kit-meta">
                        <div class="meta-item">
                            <span class="meta-icon">📅</span>
                            <span>${formatDate(kit.date_added || kit.created_at)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-icon">📦</span>
                            <span>PDF Format</span>
                        </div>
                    </div>
                    <button class="download-btn" onclick="downloadKit(${kit.id}, '${kit.company}')">
                        <span class="download-icon">⬇️</span>
                        <span>Download Kit</span>
                    </button>
                `;

                grid.appendChild(card);
            });

            kitsContainer.innerHTML = '';
            kitsContainer.appendChild(grid);
            updateResultsCount();
        }

        function applyFiltersAndSort() {
            const searchTerm = searchInput.value.trim().toLowerCase();
            const sortType = sortSelect.value;
            
            // Filter
            if (!searchTerm) {
                filteredKits = [...allKits];
            } else {
                filteredKits = allKits.filter(kit => 
                    kit.company.toLowerCase().includes(searchTerm)
                );
            }
            
            // Sort
            filteredKits = sortKits(filteredKits, sortType);
            
            renderKits(filteredKits);
        }

        // Search functionality
        searchInput.addEventListener('input', applyFiltersAndSort);
        
        // Sort functionality
        sortSelect.addEventListener('change', applyFiltersAndSort);

        async function fetchPreparationKits() {
            try {
                const response = await fetch(`${API_BASE_URL}/preparation-kits/all`, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        throw new Error('Please login to view preparation kits');
                    }
                    const errorText = await response.text();
                    throw new Error(`Failed to fetch preparation kits: ${errorText}`);
                }

                const data = await response.json();

                if (!data.success || !data.data || data.data.length === 0) {
                    allKits = [];
                    filteredKits = [];
                    showNoResults();
                    return;
                }

                // Filter by college if available
                if (loggedInCollegeId) {
                    allKits = data.data.filter(kit => 
                        kit.college_id === parseInt(loggedInCollegeId)
                    );
                } else {
                    allKits = data.data;
                }

                if (allKits.length === 0) {
                    showNoResults();
                    return;
                }

                // Sort by newest first by default
                allKits.sort((a, b) => new Date(b.date_added || b.created_at) - new Date(a.date_added || a.created_at));
                
                filteredKits = [...allKits];
                renderKits(filteredKits);

            } catch (error) {
                console.error('Error fetching kits:', error);
                showError(error.message);
            }
        }

        function downloadKit(id, company) {
            const downloadUrl = `${API_BASE_URL}/preparation-kits/download/${id}`;

            fetch(downloadUrl, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`Failed to download: ${response.status}`);
                }
                return response.blob();
            })
            .then(blob => {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${company}-Preparation-Kit.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();
                window.URL.revokeObjectURL(url);
            })
            .catch(error => {
                console.error('Download error:', error);
                alert(`❌ Failed to download preparation kit: ${error.message}`);
            });
        }

        // Initialize
        if (!token) {
            showError('Please login to view preparation kits');
        } else {
            fetchPreparationKits();
        }
    </script>
    <script src="../assets/sidebar.js"></script>
</body>
</html>
