<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>User Profile</title>
  <style>
    body {
      background: linear-gradient(135deg, #0f0f23, #0d47a1);
      color: #fff;
      font-family: 'Inter', sans-serif;
      padding: 30px;
    }
    .profile-card {
      background: #1c1c3a;
      padding: 30px;
      border-radius: 16px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }
    .profile-card h2 {
      margin-bottom: 20px;
    }
    .profile-info {
      line-height: 2em;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <h2>👤 User Profile</h2>
    <div class="profile-info">
      <p><strong>Name:</strong> John Doe</p>
      <p><strong>College:</strong> XYZ Institute of Technology</p>
      <p><strong>Leaderboard Rank:</strong> #12</p>
      <p><strong>Total Score:</strong> 875</p>
      <p><strong>Quizzes Attempted:</strong> 18</p>
    </div>
  </div>

</body>
</html>
