<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - PRIMARY KEY</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Reusable Theme CSS -->
  <link rel="stylesheet" href="../assets/theme.css">
  
  <!-- Reusable Header CSS -->
  <link rel="stylesheet" href="../assets/header.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .profile-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      transition: all 0.3s ease;
    }

    .profile-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
    }

    .profile-header {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
    }

    .profile-avatar-section {
      position: relative;
      display: inline-block;
      margin-bottom: 20px;
    }

    .profile-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: var(--btn-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      font-weight: 700;
      color: white;
      position: relative;
      overflow: hidden;
      border: 4px solid var(--glass-border);
      margin: 0 auto;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.3);
    }

    .profile-avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-gradient);
      color: white;
      border: 3px solid var(--glass-bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 12px rgba(2, 132, 199, 0.4);
    }

    .avatar-edit-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 16px rgba(2, 132, 199, 0.6);
    }

    .profile-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 8px;
    }

    .profile-email {
      font-size: 16px;
      color: var(--text-secondary);
      margin-bottom: 10px;
    }

    .profile-location {
      font-size: 14px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .stat-card:hover {
      background: var(--input-focus-bg);
      border-color: var(--input-focus-border);
      transform: translateY(-3px);
    }

    .stat-number {
      font-size: 32px;
      font-weight: 700;
      color: var(--success-text);
      margin-bottom: 8px;
      display: block;
    }

    .stat-label {
      font-size: 14px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-primary {
      background: var(--btn-gradient);
      color: white;
      box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-secondary {
      background: var(--input-bg);
      color: var(--text-primary);
      border: 1px solid var(--input-border);
    }

    .btn-secondary:hover {
      background: var(--input-focus-bg);
      border-color: var(--input-focus-border);
      transform: translateY(-2px);
    }

    /* Edit Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal.show {
      display: flex;
    }

    .modal-content {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 28px;
      color: var(--text-secondary);
      cursor: pointer;
      padding: 0;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .close-btn:hover {
      background: var(--input-bg);
      color: var(--text-primary);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 16px;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    .form-input:focus {
      outline: none;
      background: var(--input-focus-bg);
      border-color: var(--input-focus-border);
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.1);
    }

    .file-input-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }

    .file-input-btn {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px dashed var(--input-border);
      border-radius: 12px;
      color: var(--text-secondary);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .file-input-btn:hover {
      background: var(--input-focus-bg);
      border-color: var(--input-focus-border);
    }

    .file-input {
      position: absolute;
      left: 0;
      top: 0;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .file-name {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 8px;
      font-style: italic;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 30px;
    }

    .modal-actions .btn {
      flex: 1;
    }

    /* Loading State */
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid var(--input-bg);
      border-top: 4px solid var(--success-text);
      border-radius: 50%;
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Error Message */
    .error-message {
      background: var(--error-bg);
      border: 2px solid var(--error-border);
      color: var(--error-text);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
    }

    /* Success Message */
    .success-message {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color: var(--success-text);
      padding: 15px 20px;
      border-radius: 12px;
      text-align: center;
      margin-bottom: 20px;
      opacity: 0;
      transform: translateY(-10px);
      transition: all 0.3s ease;
    }

    .success-message.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        padding: 20px 15px;
      }
      
      .profile-card {
        padding: 30px 20px;
      }
      
      .profile-name {
        font-size: 26px;
      }
      
      .stats-grid {
        grid-template-columns: 1fr;
      }
      
      .action-buttons {
        flex-direction: column;
      }
      
      .btn {
        width: 100%;
        justify-content: center;
      }

      .modal-content {
        padding: 30px 20px;
      }
    }

    @media (max-width: 480px) {
      .profile-avatar {
        width: 100px;
        height: 100px;
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-card" id="profileCard">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p>Loading profile...</p>
      </div>
    </div>
  </div>

  <!-- Edit Profile Modal -->
  <div class="modal" id="editModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title">Edit Profile</h2>
        <button class="close-btn" onclick="closeEditModal()">×</button>
      </div>

      <form id="editForm" onsubmit="saveProfile(event)">
        <div class="form-group">
          <label class="form-label">Profile Photo</label>
          <div class="file-input-wrapper">
            <div class="file-input-btn">
              📷 Choose Photo
              <input type="file" class="file-input" id="photoInput" accept="image/*" onchange="handlePhotoSelect(event)">
            </div>
          </div>
          <div class="file-name" id="fileName">No file chosen</div>
        </div>

        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="nameInput" placeholder="Enter your name" required>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="emailInput" placeholder="Enter your email" disabled>
        </div>

        <div class="form-group">
          <label class="form-label">City</label>
          <input type="text" class="form-input" id="cityInput" placeholder="Enter your city">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" onclick="closeEditModal()">
            Cancel
          </button>
          <button type="submit" class="btn btn-primary">
            💾 Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Load header dynamically -->
  <script src="../assets/loadheader.js"></script>

  <script>
    let currentUser = null;
    let selectedPhotoFile = null;

    // Generate user initials for avatar
    function getInitials(name) {
      if (!name) return 'U';
      return name
        .split(' ')
        .map(word => word.charAt(0).toUpperCase())
        .join('')
        .substring(0, 2);
    }

    // Show success message
    function showSuccessMessage(message) {
      const existingMessage = document.querySelector('.success-message');
      if (existingMessage) {
        existingMessage.remove();
      }

      const successDiv = document.createElement('div');
      successDiv.className = 'success-message';
      successDiv.textContent = message;
      
      const profileCard = document.getElementById('profileCard');
      profileCard.parentNode.insertBefore(successDiv, profileCard);
      
      setTimeout(() => successDiv.classList.add('show'), 100);
      
      setTimeout(() => {
        if (successDiv.parentNode) {
          successDiv.remove();
        }
      }, 3000);
    }

    // Get auth token
    function getAuthToken() {
      return localStorage.getItem('authToken') || sessionStorage.getItem('authToken');
    }

    // Open edit modal
    function openEditModal() {
      if (!currentUser) return;

      document.getElementById('nameInput').value = currentUser.name || '';
      document.getElementById('emailInput').value = currentUser.email || '';
      document.getElementById('cityInput').value = currentUser.city || '';
      document.getElementById('fileName').textContent = 'No file chosen';
      selectedPhotoFile = null;

      document.getElementById('editModal').classList.add('show');
    }

    // Close edit modal
    function closeEditModal() {
      document.getElementById('editModal').classList.remove('show');
      selectedPhotoFile = null;
    }

    // Handle photo selection
    function handlePhotoSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      // Validate file type
      if (!file.type.startsWith('image/')) {
        alert('Please select a valid image file.');
        return;
      }

      // Validate file size (max 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('File size must be less than 5MB.');
        return;
      }

      selectedPhotoFile = file;
      document.getElementById('fileName').textContent = file.name;
    }

    // Save profile changes
    async function saveProfile(event) {
      event.preventDefault();

      const name = document.getElementById('nameInput').value.trim();
      const city = document.getElementById('cityInput').value.trim();

      if (!name) {
        alert('Name is required');
        return;
      }

      try {
        const token = getAuthToken();
        const formData = new FormData();
        
        formData.append('name', name);
        if (city) formData.append('city', city);
        if (selectedPhotoFile) formData.append('photo', selectedPhotoFile);
 const API_URL = 'http://localhost:5000/';
        const response = await fetch('http://localhost:5000/api/profile/update', 
     {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        if (!response.ok) {
          throw new Error('Failed to update profile');
        }

        const result = await response.json();
        
        closeEditModal();
        showSuccessMessage('✅ Profile updated successfully!');
        
        // Reload profile
        setTimeout(() => fetchProfile(), 1000);

      } catch (error) {
        console.error('Profile update error:', error);
        alert('Failed to update profile. Please try again.');
      }
    }

    // Fetch user profile
    async function fetchProfile() {
      const card = document.getElementById('profileCard');
      
      try {
        const token = getAuthToken();
        
        if (!token) {
          throw new Error('Please login to view your profile');
        }

        const response = await fetch(`http://localhost:5000/api/profile`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error('Session expired. Please login again.');
          }
          throw new Error(`Failed to load profile (Status: ${response.status})`);
        }

        const user = await response.json();
        currentUser =data.user;
        displayProfile(data.user);

      } catch (error) {
        console.error('Profile fetch error:', error);
        card.innerHTML = `
          <div class="error-message">
            <strong>⚠️ Failed to load profile</strong><br>
            <p style="margin-top: 10px;">${error.message}</p>
          </div>
          <div class="action-buttons" style="margin-top: 20px;">
            <button class="btn btn-primary" onclick="fetchProfile()">
              🔄 Retry
            </button>
            <button class="btn btn-secondary" onclick="window.location.href='../dashboard/dashboard.html'">
              ← Back to Dashboard
            </button>
          </div>
        `;
      }
    }

    // Display user profile
    function displayProfile(user) {
      const initials = getInitials(user.name);
      const hasPhoto = user.profileImage || user.photo;
      
      // Calculate average score
      const avgScore = user.quizzes_attended > 0 
        ? Math.round((user.total_points || 0) / user.quizzes_attended)
        : 0;
      
      const card = document.getElementById('profileCard');
      card.innerHTML = `
        <div class="profile-header">
          <div class="profile-avatar-section">
            <div class="profile-avatar">
              ${hasPhoto ? 
                `<img src="${user.profileImage || user.photo}" alt="${user.name}" onerror="this.style.display='none'; this.parentElement.textContent='${initials}';"/>` : 
                initials
              }
            </div>
            <button class="avatar-edit-btn" onclick="openEditModal()" title="Edit Profile">
              ✏️
            </button>
          </div>
          <div class="profile-name">${user.name || 'Unknown User'}</div>
          <div class="profile-email">${user.email || 'No email provided'}</div>
          <div class="profile-location">
            📍 ${user.city || 'Location not specified'}
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-number">${user.quizzes_attended || 0}</span>
            <span class="stat-label">Quizzes Taken</span>
          </div>
          <div class="stat-card">
            <span class="stat-number">${(user.total_points || 0).toLocaleString()}</span>
            <span class="stat-label">Total Points</span>
          </div>
          <div class="stat-card">
            <span class="stat-number">${avgScore.toLocaleString()}</span>
            <span class="stat-label">Average Score</span>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn btn-primary" onclick="window.location.href='../dashboard/dashboard.html'">
            🏠 Dashboard
          </button>
          <button class="btn btn-secondary" onclick="window.location.href='../leaderboard/leaderboard.html'">
            🏆 Leaderboard
          </button>
        </div>
      `;
    }

    // Close modal when clicking outside
    document.getElementById('editModal')?.addEventListener('click', function(e) {
      if (e.target === this) {
        closeEditModal();
      }
    });

    // Auto-load profile on page load
    document.addEventListener('DOMContentLoaded', () => {
      // Check authentication
      const token = getAuthToken();
      if (!token) {
        window.location.href = '../auth/registration.html';
        return;
      }
      
      fetchProfile();
    });
  </script>
</body>
</html>
