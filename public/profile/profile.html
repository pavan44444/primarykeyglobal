<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile - PRIMARY KEY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/sidebar.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 960px;
      margin: 40px auto;
      padding: 20px;
    }

    .profile-header {
      text-align: center;
      margin-bottom: 36px;
      animation: fadeInUp 0.6s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 34px;
      font-weight: 900;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .profile-grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 24px;
      align-items: start;
      animation: fadeInUp 0.6s ease 0.15s backwards;
    }

    .profile-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    /* ===== LEFT: Avatar card ===== */
    .profile-pic-section {
      text-align: center;
    }

    .profile-pic-wrapper {
      position: relative;
      width: 132px;
      height: 132px;
      margin: 0 auto 16px;
    }

    .profile-pic {
      width: 132px;
      height: 132px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #0284c7;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      font-weight: 900;
      color: white;
    }

    .upload-btn-wrapper {
      margin-top: 14px;
    }

    .upload-btn {
      background: var(--btn-gradient);
      color: white;
      padding: 9px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s ease;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
    }

    .upload-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    input[type="file"] {
      display: none;
    }

    .user-name {
      font-size: 21px;
      font-weight: 700;
      margin-top: 22px;
      margin-bottom: 6px;
      color: var(--text-primary);
    }

    .user-role {
      display: inline-block;
      padding: 5px 14px;
      background: rgba(2, 132, 199, 0.2);
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      color: #0284c7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-divider {
      border: none;
      border-top: 1px solid var(--glass-border);
      margin: 22px 0;
    }

    .stats-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 14px;
      text-align: left;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat-box {
      background: rgba(2, 132, 199, 0.1);
      padding: 14px 8px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid var(--glass-border);
    }

    .stat-value {
      font-size: 20px;
      font-weight: 900;
      color: #0284c7;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 10.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }

    /* ===== RIGHT: Info + edit sections ===== */
    .right-column {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--glass-border);
    }

    .info-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .info-label {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13.5px;
    }

    .info-value {
      color: var(--text-primary);
      font-weight: 500;
      font-size: 13.5px;
      text-align: right;
    }

    .info-value.muted {
      color: var(--text-muted);
      font-style: italic;
    }

    .edit-form {
      display: none;
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--glass-border);
    }

    .edit-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
    }

    input[type="email"] {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 2px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--input-focus-border);
      background: var(--input-focus-bg);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .btn {
      padding: 11px 22px;
      border-radius: 10px;
      border: none;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-right: 10px;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none !important;
      box-shadow: none !important;
    }

    .btn-primary {
      background: var(--btn-gradient);
      color: white;
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(2, 132, 199, 0.4);
    }

    .btn-secondary {
      background: rgba(2, 132, 199, 0.15);
      color: var(--text-primary);
      border: 1px solid var(--glass-border);
    }

    .btn-secondary:hover {
      background: rgba(2, 132, 199, 0.25);
    }

    .loading {
      text-align: center;
      padding: 100px 20px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      width: 56px;
      height: 56px;
      border: 4px solid var(--glass-border);
      border-top: 4px solid #0284c7;
      border-radius: 50%;
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-bottom: 18px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error-state {
      text-align: center;
      padding: 20px 10px;
    }

    .error-message {
      background: var(--error-bg);
      border: 2px solid var(--error-border);
      color: var(--error-text);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13.5px;
    }

    .success-message {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color: var(--success-text);
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 13.5px;
    }

    .retry-btn {
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      .profile-grid {
        grid-template-columns: 1fr;
      }

      .stats-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .container {
        margin: 20px auto;
        padding: 10px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-header">
      <h1 class="page-title">My Profile</h1>
      <p class="page-subtitle">Manage your account settings and view your statistics</p>
    </div>

    <div id="profileContent">
      <div class="loading">
        <div class="loading-spinner"></div>
        <p style="font-size: 15px; font-weight: 600;">Loading profile...</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "https://primarykeyglobal.onrender.com/api";
    const SERVER_ORIGIN = API_BASE_URL.replace(/\/api\/?$/, ''); // ✅ derive image origin from the same base, no hardcoded prod URL
    const token = localStorage.getItem('authToken');

    function resolveAssetUrl(pathFromServer) {
      if (!pathFromServer) return null;
      if (/^https?:\/\//i.test(pathFromServer)) return pathFromServer; // already absolute
      return `${SERVER_ORIGIN}${pathFromServer}`;
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str === null || str === undefined ? '' : String(str);
      return div.innerHTML;
    }

    async function fetchProfile() {
      const container = document.getElementById('profileContent');

      if (!token) {
        window.location.href = '../auth/registration.html';
        return;
      }

      container.innerHTML = `
        <div class="loading">
          <div class="loading-spinner"></div>
          <p style="font-size: 15px; font-weight: 600;">Loading profile...</p>
        </div>
      `;

      try {
        const response = await fetch(`${API_BASE_URL}/profile`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || `Failed to load profile (status ${response.status})`);
        }

        const data = await response.json();
        const user = data.user;

        if (!user) {
          throw new Error('Profile data was empty. Please try again.');
        }

        renderProfile(user);
      } catch (err) {
        console.error(err);
        container.innerHTML = `
          <div class="profile-card error-state">
            <p style="color: var(--error-text); font-size: 18px;">❌ Failed to load profile</p>
            <p style="color: var(--text-secondary); margin-top: 10px; font-size: 13.5px;">${escapeHtml(err.message)}</p>
            <button class="btn btn-primary retry-btn" onclick="fetchProfile()">🔄 Retry</button>
          </div>
        `;
      }
    }

    function renderProfile(user) {
      const container = document.getElementById('profileContent');

      const initials = (user.name || '?')
        .split(' ')
        .filter(Boolean)
        .map(n => n[0])
        .join('')
        .toUpperCase()
        .slice(0, 2);

      const profilePicUrl = resolveAssetUrl(user.profile_pic);

      const memberSince = user.created_at
        ? new Date(user.created_at).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
        : 'Unknown';

      container.innerHTML = `
        <div class="profile-grid">

          <!-- ===== SECTION: Avatar + Stats ===== -->
          <div class="profile-card">
            <div class="profile-pic-section">
              <div class="profile-pic-wrapper">
                ${profilePicUrl
                  ? `<img src="${profilePicUrl}" alt="Profile" class="profile-pic" id="profilePicImg">`
                  : `<div class="profile-pic" id="profilePicImg">${escapeHtml(initials)}</div>`
                }
              </div>
              <div class="upload-btn-wrapper">
                <button class="upload-btn" id="uploadBtn" onclick="document.getElementById('fileInput').click()">
                  📷 Change Photo
                </button>
                <input type="file" id="fileInput" accept="image/*" onchange="uploadProfilePicture()">
              </div>

              <div class="user-name">${escapeHtml(user.name)}</div>
              <div class="user-role">${escapeHtml(user.role || 'user')}</div>
            </div>

            <hr class="card-divider">

            <div class="stats-section-title">Your Stats</div>
            <div class="stats-grid">
              <div class="stat-box">
                <div class="stat-value">${escapeHtml(user.quizzes_taken ?? 0)}</div>
                <div class="stat-label">Quizzes</div>
              </div>
              <div class="stat-box">
                <div class="stat-value">${escapeHtml(user.total_points ?? 0)}</div>
                <div class="stat-label">Points</div>
              </div>
              <div class="stat-box">
                <div class="stat-value">${escapeHtml(user.average_score ?? '0.00')}</div>
                <div class="stat-label">Avg Score</div>
              </div>
            </div>
          </div>

          <!-- ===== RIGHT COLUMN ===== -->
          <div class="right-column">

            <!-- SECTION: Account Information -->
            <div class="profile-card">
              <div id="messageContainer"></div>

              <h3 class="section-title">📋 Account Information</h3>
              <div class="info-item">
                <span class="info-label">Email</span>
                <span class="info-value" id="emailValue">${escapeHtml(user.email)}</span>
              </div>
              <div class="info-item">
                <span class="info-label">College</span>
                <span class="info-value ${!user.college ? 'muted' : ''}">${escapeHtml(user.college || 'Not set')}</span>
              </div>
              <div class="info-item">
                <span class="info-label">City</span>
                <span class="info-value ${!user.city ? 'muted' : ''}">${escapeHtml(user.city || 'Not set')}</span>
              </div>
              <div class="info-item">
                <span class="info-label">Member Since</span>
                <span class="info-value">${escapeHtml(memberSince)}</span>
              </div>

              <div style="margin-top: 20px;">
                <button class="btn btn-primary" onclick="toggleEditForm()">✏️ Edit Email</button>
              </div>

              <div class="edit-form" id="editForm">
                <div class="form-group">
                  <label for="emailInput">New Email</label>
                  <input type="email" id="emailInput" value="${escapeHtml(user.email)}" required>
                </div>
                <button class="btn btn-primary" id="saveEmailBtn" onclick="updateProfile()">💾 Save Changes</button>
                <button class="btn btn-secondary" onclick="toggleEditForm()">Cancel</button>
              </div>
            </div>

          </div>
        </div>
      `;
    }

    function toggleEditForm() {
      const editForm = document.getElementById('editForm');
      editForm.classList.toggle('active');
    }

    async function updateProfile() {
      const email = document.getElementById('emailInput').value.trim();
      const messageContainer = document.getElementById('messageContainer');
      const saveBtn = document.getElementById('saveEmailBtn');

      if (!email) {
        messageContainer.innerHTML = '<div class="error-message">Email is required</div>';
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        const response = await fetch(`${API_BASE_URL}/profile`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          messageContainer.innerHTML = '<div class="success-message">✅ Email updated successfully!</div>';
          document.getElementById('emailValue').textContent = email;
          toggleEditForm();
          setTimeout(() => { messageContainer.innerHTML = ''; }, 3000);
        } else {
          messageContainer.innerHTML = `<div class="error-message">❌ ${escapeHtml(data.message || 'Failed to update profile')}</div>`;
        }
      } catch (error) {
        console.error('Update error:', error);
        messageContainer.innerHTML = '<div class="error-message">❌ Failed to update profile. Check your connection.</div>';
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 Save Changes';
      }
    }

    async function uploadProfilePicture() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      const uploadBtn = document.getElementById('uploadBtn');
      const messageContainer = document.getElementById('messageContainer');

      if (!file) return;

      uploadBtn.disabled = true;
      uploadBtn.textContent = 'Uploading...';

      const formData = new FormData();
      formData.append('profile_pic', file);

      try {
        const response = await fetch(`${API_BASE_URL}/profile/upload`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });

        const data = await response.json();

        if (response.ok && data.success) {
          const profilePicImg = document.getElementById('profilePicImg');
          const newImageUrl = resolveAssetUrl(data.profile_pic);

          if (profilePicImg.tagName === 'IMG') {
            profilePicImg.src = newImageUrl;
          } else {
            profilePicImg.outerHTML = `<img src="${newImageUrl}" alt="Profile" class="profile-pic" id="profilePicImg">`;
          }

          if (messageContainer) {
            messageContainer.innerHTML = '<div class="success-message">✅ Profile picture updated successfully!</div>';
            setTimeout(() => { messageContainer.innerHTML = ''; }, 3000);
          }
        } else {
          alert('Failed to upload: ' + (data.message || 'Unknown error'));
        }
      } catch (error) {
        console.error('Upload error:', error);
        alert('Failed to upload profile picture. Check your connection.');
      } finally {
        uploadBtn.disabled = false;
        uploadBtn.textContent = '📷 Change Photo';
        fileInput.value = '';
      }
    }

    window.onload = fetchProfile;
  </script>
  <script src="../assets/sidebar.js"></script>
</body>
</html>
