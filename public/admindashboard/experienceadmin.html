<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Experience Detail</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /*
         * CSS Variables for Theming - Same as dashboard
         */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --card-bg: rgba(26, 26, 46, 0.3);
            --card-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.3);
            --shape-bg: rgba(13, 71, 161, 0.1);
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --info-color: #2196f3;
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.2);
            --shape-bg: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /*
         * Floating background shapes
         */
        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /*
         * Theme Toggle Button
         */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .theme-icon { font-size: 20px; color: var(--text-primary); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-button {
            display: inline-block;
            padding: 12px 25px;
            background: var(--btn-gradient);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .back-button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px var(--btn-hover-shadow);
        }

        .experience-header {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .experience-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--btn-gradient);
        }

        .header-content {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;
            align-items: start;
        }

        .student-info h1 {
            font-size: 32px;
            font-weight: 700;
            margin: 0 0 10px 0;
            color: var(--text-primary);
        }

        .company-name {
            font-size: 24px;
            color: #64b5f6;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .job-details {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 15px;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .detail-value {
            font-size: 16px;
            color: var(--text-primary);
            font-weight: 500;
        }

        .package-value {
            font-size: 24px;
            color: var(--success-color);
            font-weight: 700;
        }

        .date-badge {
            background: var(--btn-gradient);
            color: white;
            padding: 12px 20px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            white-space: nowrap;
        }

        .experience-summary {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 28px;
        }

        .summary-text {
            font-size: 16px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .rounds-section {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .rounds-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .round-card {
            background: rgba(13, 71, 161, 0.1);
            border: 1px solid rgba(13, 71, 161, 0.2);
            border-radius: 15px;
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
        }

        .round-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
        }

        .round-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .round-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--info-color);
        }

        .round-date {
            font-size: 12px;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 12px;
        }

        .round-description {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-secondary);
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .error-message {
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid rgba(255, 107, 107, 0.3);
            color: #ff6b6b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin: 20px 0;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header-content {
                grid-template-columns: 1fr;
                text-align: center;
            }

            .student-info h1 {
                font-size: 24px;
            }

            .company-name {
                font-size: 20px;
            }

            .job-details {
                justify-content: center;
            }

            .package-value {
                font-size: 20px;
            }

            .experience-header,
            .experience-summary,
            .rounds-section {
                padding: 20px;
            }

            .section-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon" id="themeIcon">☀️</span>
    </div>

    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="container">
        <a href="experiences.html" class="back-button">← Back to Experiences</a>

        <div id="experienceContent">
            <div class="no-data">Loading experience details...</div>
        </div>
    </div>

    <script>
        // Theme toggle functionality
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // Set the initial theme from localStorage or default to dark
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });

            // Load experience details
            loadExperienceDetail();
        });

        function loadExperienceDetail() {
            const experienceData = sessionStorage.getItem('selectedExperience');
            const contentContainer = document.getElementById('experienceContent');

            if (!experienceData) {
                contentContainer.innerHTML = `
                    <div class="error-message">
                        <h3>No Experience Data Found</h3>
                        <p>The experience details could not be loaded. Please go back and select an experience again.</p>
                    </div>
                `;
                return;
            }

            try {
                const experience = JSON.parse(experienceData);
                renderExperienceDetail(experience);
            } catch (error) {
                contentContainer.innerHTML = `
                    <div class="error-message">
                        <h3>Error Loading Experience</h3>
                        <p>There was an error parsing the experience data. Please try again.</p>
                    </div>
                `;
            }
        }

        function renderExperienceDetail(exp) {
            const contentContainer = document.getElementById('experienceContent');
            
            contentContainer.innerHTML = `
                <div class="experience-header">
                    <div class="header-content">
                        <div class="student-info">
                            <h1>${exp.student_name}</h1>
                            <div class="company-name">🏢 ${exp.company_name}</div>
                            
                            <div class="job-details">
                                <div class="detail-item">
                                    <span class="detail-label">Job Role</span>
                                    <span class="detail-value">${exp.job_role}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Location</span>
                                    <span class="detail-value">${exp.job_location}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Package Offered</span>
                                    <span class="detail-value package-value">₹${parseFloat(exp.package_offered).toLocaleString()} LPA</span>
                                </div>
                            </div>
                        </div>
                        
                        <div class="date-badge">
                            <div style="font-size: 12px; opacity: 0.8;">Submitted on</div>
                            <div>${new Date(exp.created_at).toLocaleDateString('en-US', { 
                                year: 'numeric', 
                                month: 'long', 
                                day: 'numeric' 
                            })}</div>
                        </div>
                    </div>
                </div>

                ${exp.experience_summary ? `
                <div class="experience-summary">
                    <div class="section-title">
                        <span class="section-icon">📝</span>
                        Experience Summary
                    </div>
                    <div class="summary-text">${exp.experience_summary}</div>
                </div>
                ` : ''}

                <div class="rounds-section">
                    <div class="section-title">
                        <span class="section-icon">🎯</span>
                        Interview Rounds
                        <span style="margin-left: auto; background: rgba(13, 71, 161, 0.2); padding: 6px 12px; border-radius: 15px; font-size: 14px;">
                            ${exp.rounds && exp.rounds.length > 0 ? exp.rounds.length : 0} Round${exp.rounds && exp.rounds.length !== 1 ? 's' : ''}
                        </span>
                    </div>
                    
                    <div class="rounds-grid">
                        ${renderRounds(exp.rounds)}
                    </div>
                </div>
            `;
        }

        function renderRounds(rounds) {
            if (!rounds || rounds.length === 0) {
                return '<div class="no-data">No interview rounds details available.</div>';
            }

            return rounds.map(round => `
                <div class="round-card">
                    <div class="round-header">
                        <div class="round-title">
                            Round ${round.round_number}: ${round.round_type}
                        </div>
                        <div class="round-date">
                            ${new Date(round.round_date).toLocaleDateString('en-US', { 
                                month: 'short', 
                                day: 'numeric', 
                                year: 'numeric' 
                            })}
                        </div>
                    </div>
                    <div class="round-description">
                        ${round.round_description || 'No description provided for this round.'}
                    </div>
                </div>
            `).join('');
        }
    </script>
  <iframe src="../report.html" 
  style="position: fixed; bottom: 20px; right: 20px; 
         width: 320px; height: 250px; border: none; 
         z-index: 9999; overflow: visible; background: transparent;">
</iframe>

</body>
</html>
