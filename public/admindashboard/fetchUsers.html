<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Users - PrimaryKey Platform</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /*
     * CSS Variables for Theming - Same as dashboard
     */
    :root {
        --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
        --secondary-bg: rgba(13, 71, 161, 0.1);
        --card-bg: rgba(26, 26, 46, 0.3);
        --card-border: rgba(13, 71, 161, 0.3);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.8);
        --text-muted: rgba(255, 255, 255, 0.6);
        --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
        --btn-hover-shadow: rgba(0, 0, 0, 0.3);
        --shape-bg: rgba(13, 71, 161, 0.1);
        --success-color: #4caf50;
        --warning-color: #ff9800;
        --info-color: #64b5f6;
    }

    [data-theme="light"] {
        --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
        --secondary-bg: rgba(33, 150, 243, 0.1);
        --card-bg: rgba(255, 255, 255, 0.4);
        --card-border: rgba(33, 150, 243, 0.3);
        --text-primary: #1a1a2e;
        --text-secondary: rgba(26, 26, 46, 0.8);
        --text-muted: rgba(26, 26, 46, 0.6);
        --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
        --btn-hover-shadow: rgba(0, 0, 0, 0.2);
        --shape-bg: rgba(255, 255, 255, 0.2);
        --success-color: #4caf50;
        --warning-color: #ff9800;
        --info-color: #1976d2;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--primary-bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
      transition: all 0.3s ease;
    }

    /*
     * Floating background shapes
     */
    .floating-shapes {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        overflow: hidden;
        z-index: -1;
    }

    .shape {
        position: absolute;
        border-radius: 50%;
        background: var(--shape-bg);
        backdrop-filter: blur(10px);
        animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }
    .shape:nth-child(4) { width: 100px; height: 100px; top: 70%; left: 60%; animation-delay: 3s; }
    .shape:nth-child(5) { width: 70px; height: 70px; top: 30%; right: 40%; animation-delay: 1s; }

    @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
    }

    /*
     * Theme Toggle Button
     */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        z-index: 100;
    }

    .theme-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 5px 15px var(--btn-hover-shadow);
    }

    .theme-icon { font-size: 20px; color: var(--text-primary); }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .page-title {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 10px;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        color: var(--text-primary);
    }

    .page-subtitle {
        font-size: 20px;
        color: var(--text-secondary);
        margin-bottom: 30px;
    }

    .search-section {
        display: flex;
        justify-content: center;
        margin-bottom: 40px;
    }

    .search-container {
        position: relative;
        max-width: 500px;
        width: 100%;
    }

    .search-input {
        width: 100%;
        padding: 15px 50px 15px 20px;
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        color: var(--text-primary);
        font-size: 16px;
        transition: all 0.3s ease;
        outline: none;
    }

    .search-input:focus {
        border-color: var(--info-color);
        box-shadow: 0 0 20px rgba(100, 181, 246, 0.2);
    }

    .search-input::placeholder {
        color: var(--text-muted);
    }

    .search-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 8px;
        border-radius: 50%;
        transition: all 0.3s ease;
        color: var(--text-secondary);
    }

    .search-btn:hover {
        background: rgba(100, 181, 246, 0.1);
        color: var(--info-color);
    }

    .stats-overview {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 40px;
    }

    .stat-card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        border: 1px solid var(--card-border);
        border-radius: 15px;
        padding: 20px;
        text-align: center;
        transition: all 0.3s ease;
    }

    .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .stat-value {
        font-size: 32px;
        font-weight: 700;
        color: var(--info-color);
        margin-bottom: 5px;
    }

    .stat-label {
        font-size: 14px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    #output {
        min-height: 200px;
    }

    .users-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 25px;
        margin-top: 30px;
    }

    .user-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .user-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .user-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--btn-gradient);
    }

    .user-header {
        display: flex;
        align-items: center;
        gap: 15px;
        margin-bottom: 20px;
    }

    .user-avatar {
        width: 60px;
        height: 60px;
        border-radius: 50%;
        background: var(--btn-gradient);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        font-weight: 700;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .user-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }

    .user-basic-info {
        flex: 1;
    }

    .user-name {
        font-size: 20px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 5px;
    }

    .user-email {
        font-size: 14px;
        color: var(--text-muted);
        margin-bottom: 3px;
    }

    .user-location {
        font-size: 13px;
        color: var(--info-color);
        font-weight: 500;
    }

    .user-role-badge {
        position: absolute;
        top: 15px;
        right: 15px;
        padding: 6px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .role-student {
        background: rgba(76, 175, 80, 0.2);
        color: var(--success-color);
        border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .role-admin {
        background: rgba(255, 152, 0, 0.2);
        color: var(--warning-color);
        border: 1px solid rgba(255, 152, 0, 0.3);
    }

    .admin-badge {
        position: absolute;
        top: 50px;
        right: 15px;
        padding: 4px 8px;
        border-radius: 15px;
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        background: linear-gradient(135deg, #ffd700, #ffb300);
        color: #1a1a2e;
        box-shadow: 0 2px 8px rgba(255, 215, 0, 0.3);
    }

    .user-stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--card-border);
    }

    .stat-item {
        text-align: center;
        padding: 12px;
        background: rgba(13, 71, 161, 0.1);
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    .stat-item:hover {
        background: rgba(13, 71, 161, 0.2);
    }

    .stat-number {
        font-size: 20px;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 3px;
    }

    .stat-text {
        font-size: 12px;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .user-id {
        position: absolute;
        bottom: 15px;
        right: 15px;
        font-size: 11px;
        color: var(--text-muted);
        background: rgba(0, 0, 0, 0.2);
        padding: 4px 8px;
        border-radius: 8px;
        backdrop-filter: blur(10px);
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
    }

    .loading::before {
        content: '';
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top: 4px solid var(--info-color);
        border-radius: 50%;
        display: inline-block;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    .no-users {
        text-align: center;
        padding: 80px 20px;
        color: var(--text-secondary);
    }

    .no-users-icon {
        font-size: 64px;
        margin-bottom: 20px;
        opacity: 0.5;
    }

    .no-users-title {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .no-users-text {
        font-size: 16px;
        opacity: 0.8;
    }

    .error-message {
        background: rgba(244, 67, 54, 0.1);
        border: 1px solid rgba(244, 67, 54, 0.3);
        color: #f44336;
        padding: 15px 20px;
        border-radius: 12px;
        text-align: center;
        margin-bottom: 20px;
        backdrop-filter: blur(10px);
    }

    /* Responsive Design */
    @media (max-width: 768px) {
        .page-title {
            font-size: 36px;
        }
        
        .page-subtitle {
            font-size: 18px;
        }
        
        .users-grid {
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .user-card {
            padding: 20px;
        }
        
        .controls-section {
            flex-direction: column;
            gap: 15px;
        }
        
        .stats-overview {
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
    }

    @media (max-width: 480px) {
        .container {
            padding: 15px;
        }
        
        .user-header {
            flex-direction: column;
            text-align: center;
            gap: 10px;
        }
        
        .user-role-badge {
            position: static;
            margin-top: 10px;
        }
        
        .stats-overview {
            grid-template-columns: 1fr;
        }
    }
  </style>
</head>
<body>
  <!-- Floating Background Shapes -->
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <!-- Theme Toggle -->
  <div class="theme-toggle" onclick="toggleTheme()">
    <span class="theme-icon">🌓</span>
  </div>

  <div class="container">
    <!-- Page Header -->
    <div class="page-header">
      <h1 class="page-title">College Community</h1>
      <p class="page-subtitle">Discover and connect with fellow students and faculty</p>
    </div>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search users by name..." class="search-input">
        <button class="search-btn" onclick="clearSearch()">
          <span id="searchIcon">🔍</span>
        </button>
      </div>
    </div>

    <!-- Stats Overview -->
    <div class="stats-overview" id="statsOverview" style="display: none;">
      <div class="stat-card">
        <div class="stat-value" id="totalUsers">0</div>
     <div class="stat-label">Total Users</div>
      </div>
    </div>

    <!-- Output Section -->
    <div id="output"></div>
  </div>

  <script>
    // Theme Toggle Functionality
    function toggleTheme() {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', newTheme);
      
      // Save theme preference
      try {
        sessionStorage.setItem('theme', newTheme);
      } catch (e) {
        console.log('Theme preference could not be saved');
      }
    }

    // Load saved theme
    function loadSavedTheme() {
      try {
        const savedTheme = sessionStorage.getItem('theme');
        if (savedTheme) {
          document.body.setAttribute('data-theme', savedTheme);
        }
      } catch (e) {
        console.log('Could not load saved theme');
      }
    }

    // Global variables for user data and search
    let allUsers = [];
    let filteredUsers = [];

    // Initialize theme on page load
    loadSavedTheme();

    // Navigate to profile page
    function navigateToProfile(userId, userName) {
      // Navigate to profile.html with user information
      window.location.href = `profile.html?userId=${userId}&name=${encodeURIComponent(userName)}`;
    }

    // Search functionality
    function setupSearchFunctionality() {
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.querySelector('.search-btn');
      const searchIcon = document.getElementById('searchIcon');

      searchInput.addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase().trim();
        
        if (searchTerm === '') {
          filteredUsers = [...allUsers];
          searchIcon.textContent = '🔍';
        } else {
          filteredUsers = allUsers.filter(user => 
            (user.name || '').toLowerCase().includes(searchTerm)
          );
          searchIcon.textContent = '✖️';
        }
        
        displayUsers(filteredUsers);
      });

      // Clear search function
      window.clearSearch = function() {
        searchInput.value = '';
        filteredUsers = [...allUsers];
        searchIcon.textContent = '🔍';
        displayUsers(filteredUsers);
      };
    }

    // Display users in grid
    function displayUsers(users) {
      const output = document.getElementById('output');
      
      if (!Array.isArray(users) || users.length === 0) {
        const isSearching = document.getElementById('searchInput').value.trim() !== '';
        output.innerHTML = `
          <div class="no-users">
            <div class="no-users-icon">${isSearching ? '🔍' : '👥'}</div>
            <div class="no-users-title">${isSearching ? 'No Results Found' : 'No Users Found'}</div>
            <div class="no-users-text">
              ${isSearching ? 
                'Try adjusting your search terms or clear the search to see all users.' : 
                'There are currently no users in your college community.'
              }
            </div>
          </div>
        `;
        return;
      }

      // Display statistics
      displayStatistics(users);

      // Create users grid
      const usersGrid = document.createElement('div');
      usersGrid.className = 'users-grid';
      
      users.forEach(user => {
        usersGrid.innerHTML += createUserCard(user);
      });

      output.innerHTML = '';
      output.appendChild(usersGrid);
    }

    // Generate user initials for avatar
    function getInitials(name) {
      return name
        .split(' ')
        .map(word => word.charAt(0).toUpperCase())
        .join('')
        .substring(0, 2);
    }

    // Get role class for styling
    function getRoleClass(role) {
      const roleMap = {
        'student': 'role-student',
        'admin': 'role-admin', 
        'teacher': 'role-teacher',
        'faculty': 'role-teacher'
      };
      return roleMap[role.toLowerCase()] || 'role-student';
    }

    // Calculate and display statistics
    function displayStatistics(users) {
      const statsOverview = document.getElementById('statsOverview');
      const totalUsers = users.length;

      document.getElementById('totalUsers').textContent = totalUsers;

      statsOverview.style.display = 'grid';
    }

    // Create user card HTML
    function createUserCard(user) {
      const initials = getInitials(user.name || 'Unknown User');
      const roleClass = getRoleClass(user.role || 'student');
      const isAdmin = user.is_admin || user.admin || false;
      
      return `
        <div class="user-card" onclick="navigateToProfile('${user.user_id}', '${user.name}')">
          <div class="user-role-badge ${roleClass}">
            ${user.role || 'Student'}
          </div>
          ${isAdmin ? '<div class="admin-badge">👑 ADMIN</div>' : ''}
          
          <div class="user-header">
            <div class="user-avatar">
              ${user.profileImage ? 
                `<img src="${user.profileImage}" alt="${user.name}" onerror="this.style.display='none'; this.parentElement.textContent='${initials}';"/>` : 
                initials
              }
            </div>
            <div class="user-basic-info">
              <div class="user-name">${user.name || 'Unknown User'}</div>
              <div class="user-email">${user.email || 'No email provided'}</div>
              <div class="user-location">📍 ${user.city || 'Location not specified'}</div>
            </div>
          </div>
          
          <div class="user-stats">
            <div class="stat-item">
              <div class="stat-number">${user.quizzes_attended || 0}</div>
              <div class="stat-text">Quizzes</div>
            </div>
            <div class="stat-item">
              <div class="stat-number">${(user.total_points || 0).toLocaleString()}</div>
              <div class="stat-text">Points</div>
            </div>
          </div>
          
          <div class="user-id">ID: ${user.user_id || 'N/A'}</div>
        </div>
      `;
    }

    // Fetch users from API
    async function fetchUsers() {
      const output = document.getElementById('output');
      
      // Show loading state
      output.innerHTML = '<div class="loading">Fetching college users...</div>';

      try {
        // Get auth token from sessionStorage instead of localStorage
        let token;
        try {
          token = sessionStorage.getItem('authToken') || localStorage.getItem('authToken');
        } catch (e) {
          token = 'demo-token'; // Fallback for demo purposes
        }
           const API_URL = 'http://localhost:5000/';
        //const response = await fetch("https://primarykey-production-6114.up.railway.app/api/users/college", {
        const response = await fetch(`${API_URL}api/users/college`, {
          method: "GET",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          }
        });

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const users = await response.json();

        // Store users globally for search functionality
        allUsers = Array.isArray(users) ? users : [];
        filteredUsers = [...allUsers];

        // Display users
        displayUsers(filteredUsers);

        // Setup search functionality after users are loaded
        setupSearchFunctionality();

      } catch (error) {
        console.error('Error fetching users:', error);
        output.innerHTML = `
          <div class="error-message">
            <strong>Error loading users!</strong><br>
            ${error.message === 'Failed to fetch' ? 
              'Unable to connect to the server. Please check your connection and try again.' : 
              error.message
            }
          </div>
        `;
        document.getElementById('statsOverview').style.display = 'none';
      }
    }

    // Auto-load users when page loads
    window.addEventListener('load', fetchUsers);
  </script>
</body>
</html>
