<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preparation Kit Management - PRIMARY KEY</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #06b6d4;
            --accent: #8b5cf6;
            --success: #10b981;
            --error: #ef4444;
            --bg-dark: #0a0f1e;
            --bg-darker: #050911;
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.75);
            --text-muted: rgba(255, 255, 255, 0.5);
            --glow: rgba(79, 70, 229, 0.4);
        }

        [data-theme="light"] {
            --primary: #4f46e5;
            --primary-dark: #4338ca;
            --secondary: #06b6d4;
            --accent: #8b5cf6;
            --success: #059669;
            --error: #dc2626;
            --bg-dark: #f8fafc;
            --bg-darker: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(79, 70, 229, 0.15);
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --glow: rgba(79, 70, 229, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-darker);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .gradient-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            opacity: 0.4;
            background: radial-gradient(circle at 20% 50%, var(--primary) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, var(--secondary) 0%, transparent 50%),
                        radial-gradient(circle at 40% 20%, var(--accent) 0%, transparent 50%);
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 1;
            animation: float 25s ease-in-out infinite;
        }

        .orb-1 {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            top: -150px;
            left: -150px;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, var(--secondary), var(--primary));
            bottom: -100px;
            right: -100px;
            animation-delay: 8s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(80px, -80px); }
            66% { transform: translate(-80px, 80px); }
        }

        .glass {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 32px 80px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .back-button {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 24px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            text-decoration: none;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: 600;
        }

        .back-button:hover {
            border-color: var(--primary);
            transform: translateX(-5px);
            box-shadow: 0 8px 24px var(--glow);
        }

        .theme-toggle {
            width: 45px;
            height: 45px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 20px;
            border: none;
        }

        .theme-toggle:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 24px var(--glow);
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 30px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(6, 182, 212, 0.15));
            border: 1px solid rgba(79, 70, 229, 0.3);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 24px;
            backdrop-filter: blur(10px);
        }

        .page-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(36px, 6vw, 56px);
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .page-subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        /* Upload Section */
        .upload-section {
            border-radius: 24px;
            padding: 40px 36px;
            margin-bottom: 48px;
            animation: fadeInUp 0.8s ease 0.2s backwards;
            position: relative;
            overflow: hidden;
        }

        .upload-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: 700;
            color: var(--text-primary);
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 16px 20px;
            border-radius: 12px;
            border: 2px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="file"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
        }

        input[type="file"]::file-selector-button {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-right: 12px;
            transition: all 0.3s ease;
        }

        input[type="file"]::file-selector-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4);
        }

        .btn {
            padding: 18px 36px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 8px 28px rgba(79, 70, 229, 0.4);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transition: left 0.6s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 40px rgba(79, 70, 229, 0.6);
        }

        /* Alert */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-weight: 600;
            display: none;
            animation: slideDown 0.4s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .alert-success {
            background: rgba(16, 185, 129, 0.15);
            border: 2px solid rgba(16, 185, 129, 0.3);
            color: var(--success);
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 2px solid rgba(239, 68, 68, 0.3);
            color: var(--error);
        }

        /* Kits List */
        .kits-section {
            animation: fadeInUp 0.8s ease 0.4s backwards;
        }

        .kits-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
            margin-top: 32px;
        }

        .kit-card {
            padding: 28px 24px;
            border-radius: 20px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            animation: slideUp 0.6s ease backwards;
        }

        .kit-card:nth-child(1) { animation-delay: 0.5s; }
        .kit-card:nth-child(2) { animation-delay: 0.6s; }
        .kit-card:nth-child(3) { animation-delay: 0.7s; }
        .kit-card:nth-child(4) { animation-delay: 0.8s; }
        .kit-card:nth-child(5) { animation-delay: 0.9s; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .kit-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.05), rgba(6, 182, 212, 0.05));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .kit-card:hover::before {
            opacity: 1;
        }

        .kit-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }

        .kit-card:hover::after {
            transform: scaleX(1);
        }

        .kit-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
        }

        .kit-company {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .kit-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            color: var(--text-secondary);
        }

        .meta-icon {
            font-size: 16px;
        }

        /* Loading & Empty States */
        .loading, .empty-state {
            text-align: center;
            padding: 80px 40px;
            border-radius: 24px;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--card-border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 24px;
            opacity: 0.5;
        }

        .empty-state h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .empty-state p {
            color: var(--text-secondary);
            font-size: 16px;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .container {
                padding: 20px 20px 60px;
            }

            .kits-grid {
                grid-template-columns: 1fr;
            }

            .upload-section {
                padding: 32px 24px;
            }

            .page-title {
                font-size: 36px;
                letter-spacing: -1px;
            }

            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }

        * {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }
    </style>
</head>
<body>
    <div class="gradient-bg"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="container">
        <div class="top-bar">
            <a href="admindashboard.html" class="back-button">
                ← Back to Dashboard
            </a>
            <button class="theme-toggle glass" id="themeToggle">
                <span id="themeIcon">☀️</span>
            </button>
        </div>

        <div class="header">
            <div class="header-badge">
                <span>📚</span>
                <span>Resource Management</span>
            </div>
            <h1 class="page-title">Preparation Kit Management</h1>
            <p class="page-subtitle">Upload and manage company-wise preparation resources for students</p>
        </div>

        <div id="alertBox"></div>

        <!-- Upload Section -->
        <div class="upload-section glass">
            <h2 class="section-title">
                <span>📤</span>
                <span>Upload New Preparation Kit</span>
            </h2>
            <form id="uploadForm">
                <div class="form-group">
                    <label for="companyName">Company Name *</label>
                    <input type="text" id="companyName" name="company" required placeholder="e.g., Google, Microsoft, Amazon">
                </div>

                <div class="form-group">
                    <label for="pdfFile">Upload PDF File *</label>
                    <input type="file" id="pdfFile" name="pdfFile" accept=".pdf" required>
                </div>

                <button type="submit" class="btn btn-primary">Upload Preparation Kit</button>
            </form>
        </div>

        <!-- Kits List Section -->
        <div class="kits-section">
            <h2 class="section-title">
                <span>📋</span>
                <span>All Preparation Kits</span>
            </h2>
            <div id="kitsContainer">
                <div class="loading glass">
                    <div class="loading-spinner"></div>
                    <p style="color: var(--text-secondary); font-size: 18px; font-weight: 600;">Loading preparation kits...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
       // const API_BASE_URL = "https://primarykey-production-6114.up.railway.app/api/preparation-kits";
    const API_BASE_URL = "http://localhost:5000/api/preparation-kits";
        // Theme Toggle - Maintain consistency
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        function getAuthToken() {
            return sessionStorage.getItem('authToken') || localStorage.getItem('authToken');
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert alert-${type}" style="display: block;">${message}</div>`;
            setTimeout(() => {
                alertBox.innerHTML = '';
            }, 5000);
        }

        function formatDate(dateString) {
            if (!dateString) return 'Date not available';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return 'Invalid date';
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });
            } catch (error) {
                return 'Invalid date';
            }
        }

        async function loadPreparationKits() {
            try {
                const response = await fetch(`${API_BASE_URL}/all`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data.success) {
                    displayKits(data.data || []);
                } else {
                    showAlert(data.message || 'Failed to load preparation kits', 'error');
                }
            } catch (error) {
                console.error('Load preparation kits error:', error);
                showAlert('Error loading preparation kits: ' + error.message, 'error');
            }
        }

        function displayKits(kits) {
            const container = document.getElementById('kitsContainer');

            if (!kits || kits.length === 0) {
                container.innerHTML = `
                    <div class="empty-state glass">
                        <div class="empty-icon">📭</div>
                        <h3>No Preparation Kits Found</h3>
                        <p>Upload your first preparation kit to get started!</p>
                    </div>
                `;
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'kits-grid';

            kits.forEach((kit, index) => {
                const card = document.createElement('div');
                card.className = 'kit-card glass';

                card.innerHTML = `
                    <div class="kit-company">${kit.company || 'Unknown Company'}</div>
                    <div class="kit-meta">
                        <div class="meta-item">
                            <span class="meta-icon">📅</span>
                            <span>Added: ${formatDate(kit.date_added)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-icon">👤</span>
                            <span>Uploaded by: ${kit.uploaded_by || 'Admin'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-icon">🏫</span>
                            <span>${kit.college_name || 'Unknown College'}</span>
                        </div>
                    </div>
                `;

                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        // Upload Form Handler
        document.addEventListener('DOMContentLoaded', function() {
            const uploadForm = document.getElementById('uploadForm');
           
            if (uploadForm) {
                uploadForm.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const formData = new FormData(e.target);
                    const company = formData.get('company');
                    const pdfFile = formData.get('pdfFile');

                    if (!company || !company.trim()) {
                        showAlert('Please enter a company name', 'error');
                        return;
                    }

                    if (!pdfFile || pdfFile.size === 0) {
                        showAlert('Please select a PDF file', 'error');
                        return;
                    }

                    if (!pdfFile.name.toLowerCase().endsWith('.pdf')) {
                        showAlert('Please upload a PDF file only', 'error');
                        return;
                    }

                    if (pdfFile.size > 10 * 1024 * 1024) {
                        showAlert('File size must be less than 10MB', 'error');
                        return;
                    }

                    try {
                        const response = await fetch(`${API_BASE_URL}/add`, {
                            method: 'POST',
                            headers: {
                                'Authorization': `Bearer ${getAuthToken()}`
                            },
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const data = await response.json();

                        if (data.success) {
                            showAlert('✅ Preparation kit uploaded successfully!', 'success');
                            e.target.reset();
                            loadPreparationKits();
                        } else {
                            showAlert(data.message || 'Failed to upload', 'error');
                        }
                    } catch (error) {
                        console.error('Upload error:', error);
                        showAlert('❌ Error uploading preparation kit: ' + error.message, 'error');
                    }
                });
            }
        });

        // Load kits on page load
        window.addEventListener('load', loadPreparationKits);
    </script>
</body>
</html>
