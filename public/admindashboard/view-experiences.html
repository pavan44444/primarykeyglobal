<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview Experiences</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /*
     * CSS Variables for Theming - Same as dashboard
     */
    :root {
        --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
        --secondary-bg: rgba(13, 71, 161, 0.1);
        --card-bg: rgba(26, 26, 46, 0.3);
        --card-border: rgba(13, 71, 161, 0.3);
        --text-primary: #ffffff;
        --text-secondary: rgba(255, 255, 255, 0.8);
        --text-muted: rgba(255, 255, 255, 0.6);
        --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
        --btn-hover-shadow: rgba(0, 0, 0, 0.3);
        --shape-bg: rgba(13, 71, 161, 0.1);
    }

    [data-theme="light"] {
        --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
        --secondary-bg: rgba(33, 150, 243, 0.1);
        --card-bg: rgba(255, 255, 255, 0.4);
        --card-border: rgba(33, 150, 243, 0.3);
        --text-primary: #1a1a2e;
        --text-secondary: rgba(26, 26, 46, 0.8);
        --text-muted: rgba(26, 26, 46, 0.6);
        --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
        --btn-hover-shadow: rgba(0, 0, 0, 0.2);
        --shape-bg: rgba(255, 255, 255, 0.2);
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--primary-bg);
      color: var(--text-primary);
      min-height: 100vh;
      padding: 20px;
      margin: 0;
      overflow-x: hidden;
      transition: all 0.3s ease;
    }
    /* Add style for "Share Your Experience" button */
.add-experience-button {
    display: inline-block;
    padding: 12px 25px;
    background: var(--btn-gradient);
    border-radius: 10px;
    color: white;
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    margin-left: 15px;
}

.add-experience-button:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 20px var(--btn-hover-shadow);
}

/* Fix for red line (likely from errorMessage border) */
#errorMessage {
    border: none; /* remove any red border */
    background: rgba(255, 107, 107, 0.1); /* optional: keep subtle red background */
    color: #ff6b6b;
    margin-bottom: 20px;
    text-align: center;
    padding: 15px;
    border-radius: 10px;
    backdrop-filter: blur(10px);
    display: none; /* hide when no error */
}

/* Show error only when needed */
#errorMessage.show {
    display: block;
}


    /*
     * Floating background shapes
     */
    .floating-shapes {
        position: fixed;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        overflow: hidden;
        z-index: -1;
    }

    .shape {
        position: absolute;
        border-radius: 50%;
        background: var(--shape-bg);
        backdrop-filter: blur(10px);
        animation: float 6s ease-in-out infinite;
    }

    .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }

    @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(180deg); }
    }

    /*
     * Theme Toggle Button
     */
    .theme-toggle {
        position: fixed;
        top: 20px;
        right: 20px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 50%;
        width: 50px;
        height: 50px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: all 0.3s ease;
        backdrop-filter: blur(10px);
        z-index: 100;
    }

    .theme-toggle:hover {
        transform: scale(1.1);
        box-shadow: 0 5px 15px var(--btn-hover-shadow);
    }

    .theme-icon { font-size: 20px; color: var(--text-primary); }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .page-header {
        text-align: center;
        margin-bottom: 50px;
    }

    .page-title {
        font-size: 48px;
        font-weight: 700;
        margin-bottom: 10px;
        text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        color: var(--text-primary);
    }

    .page-subtitle {
        font-size: 20px;
        color: var(--text-secondary);
        margin-bottom: 20px;
    }

    .back-button {
        display: inline-block;
        padding: 12px 25px;
        background: var(--btn-gradient);
        border-radius: 10px;
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        margin-bottom: 30px;
    }

    .back-button:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 20px var(--btn-hover-shadow);
    }

    #errorMessage {
      color: #ff6b6b;
      margin-bottom: 20px;
      text-align: center;
      padding: 15px;
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      border-radius: 10px;
      backdrop-filter: blur(10px);
    }

    .experiences-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 25px;
        margin-top: 30px;
    }

    .experience-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .experience-card:hover {
      transform: translateY(-10px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
    }

    .experience-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 4px;
        background: var(--btn-gradient);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .student-info {
        flex: 1;
    }

    .student-name {
      font-size: 20px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 5px;
    }

    .company-name {
      font-size: 18px;
      font-weight: 500;
      color: #64b5f6;
      margin-bottom: 10px;
    }

    .date-badge {
        background: var(--btn-gradient);
        color: white;
        padding: 6px 12px;
        border-radius: 15px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
    }

    .card-content {
        margin-bottom: 20px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .info-label {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .info-value {
      font-size: 16px;
      color: var(--text-primary);
      font-weight: 600;
    }

    .package-highlight {
        color: #4caf50;
        font-size: 18px;
        font-weight: 700;
    }

    .rounds-summary {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--card-border);
    }

    .rounds-count {
        background: rgba(13, 71, 161, 0.2);
        color: var(--text-primary);
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: 600;
    }

    .view-details {
        color: #64b5f6;
        font-size: 14px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .view-details::after {
        content: '→';
        transition: transform 0.3s ease;
    }

    .experience-card:hover .view-details::after {
        transform: translateX(5px);
    }

    .no-experiences {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
        font-size: 18px;
    }

    .loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
    }

    .loading::before {
        content: '';
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid var(--text-primary);
        border-radius: 50%;
        display: inline-block;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
        .page-title {
            font-size: 36px;
        }
        
        .experiences-grid {
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .experience-card {
            padding: 20px;
        }
        
        .card-header {
            flex-direction: column;
            align-items: flex-start;
        }
        
        .info-row {
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }
    }
    .disabled-link {
  pointer-events: none; /* disables clicking */
  color: gray;
  cursor: not-allowed;
  opacity: 0.6;
  text-decoration: none;
}

    
  </style>
</head>
<body>

  <div class="theme-toggle" id="themeToggle">
    <span class="theme-icon" id="themeIcon">☀️</span>
  </div>

  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>

  <div class="container">
    <div class="page-header">
      <h1 class="page-title">Interview Experiences</h1>
      <p class="page-subtitle">Learn from your peers' interview journeys</p>

      <a href="../dashboard/dashboard.html" class="back-button">← Back to Dashboard</a>
     <a href="add-experience.html" class="add-experience-button">Share Your Experience</a>

    </div>

    <div id="errorMessage"></div>

    <div id="experiencesContainer">
      <div class="loading">Loading experiences...</div>
    </div>
  </div>

  <script>
   // const API_URL  = "http://localhost:5000/";
    const API_URL = 'https://primarykey-production-6114.up.railway.app/';
    const experiencesContainer = document.getElementById('experiencesContainer');
    const errorMessage = document.getElementById('errorMessage');

    // Theme toggle functionality
    document.addEventListener('DOMContentLoaded', () => {
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // Set the initial theme from localStorage or default to dark
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Load experiences
        loadExperiences();
    });

    async function loadExperiences() {
      errorMessage.textContent = '';
      experiencesContainer.innerHTML = '<div class="loading">Loading experiences...</div>';

      const token = localStorage.getItem('authToken');
      console.log(token);
      if (!token) {
        errorMessage.textContent = 'Authentication token not found. Please login first.';
        experiencesContainer.innerHTML = '';
        return;
      }

      try {
        const response = await fetch(`${API_URL}api/interviews/college`, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error('Unauthorized: Invalid or expired token.');
          } else {
            throw new Error('Failed to fetch data. Status: ' + response.status);
          }
        }

        const experiences = await response.json();

        if (!Array.isArray(experiences) || experiences.length === 0) {
          experiencesContainer.innerHTML = '<div class="no-experiences">No interview experiences found for your college yet.</div>';
          return;
        }

        renderExperiences(experiences);

      } catch (err) {
        errorMessage.textContent = err.message;
        experiencesContainer.innerHTML = '';
      }
    }

    function renderExperiences(experiences) {
        experiencesContainer.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'experiences-grid';

        experiences.forEach((exp, index) => {
            const card = document.createElement('div');
            card.className = 'experience-card';
            card.style.animationDelay = `${index * 0.1}s`;

            card.innerHTML = `
                <div class="card-header">
                    <div class="student-info">
                        <div class="student-name">${exp.student_name}</div>
                        <div class="company-name">🏢 ${exp.company_name}</div>
                    </div>
                    <div class="date-badge">
                        ${new Date(exp.created_at).toLocaleDateString()}
                    </div>
                </div>
                
                <div class="card-content">
                    <div class="info-row">
                        <span class="info-label">Job Role:</span>
                        <span class="info-value">${exp.job_role}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Location:</span>
                        <span class="info-value">${exp.job_location}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">Package:</span>
                        <span class="info-value package-highlight">₹${parseFloat(exp.package_offered).toLocaleString()} LPA</span>
                    </div>
                </div>

                <div class="rounds-summary">
                    <div class="rounds-count">
                        ${exp.rounds ? exp.rounds.length : 0} Rounds
                    </div>
                    <div class="view-details">
                        View Details
                    </div>
                </div>
            `;

            // Click handler to open detailed view
            card.addEventListener('click', () => {
                openExperienceDetail(exp);
            });

            grid.appendChild(card);
        });

        experiencesContainer.appendChild(grid);
    }

    function openExperienceDetail(experience) {
        // Store the experience data in sessionStorage
        sessionStorage.setItem('selectedExperience', JSON.stringify(experience));
        
        // Open the detailed view in a new page
        window.location.href = 'experienceadmin.html';
    }

       </script>
   <iframe src="../report.html" 
  style="position: fixed; bottom: 20px; right: 20px; 
         width: 320px; height: 250px; border: none; 
         z-index: 9999; overflow: visible; background: transparent;">
</iframe>



</body>
</html>
