<!DOCTYPE html>
<html lang="en">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Details - Admin Panel</title>
    <link rel="icon" type="image/png" href="../../logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /*
         * CSS Variables for Theming - Same as dashboard
         */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --card-bg: rgba(26, 26, 46, 0.3);
            --card-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.3);
            --shape-bg: rgba(13, 71, 161, 0.1);
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --info-color: #64b5f6;
            --danger-color: #f44336;
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.2);
            --shape-bg: rgba(255, 255, 255, 0.2);
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --info-color: #1976d2;
            --danger-color: #f44336;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            margin: 0;
            overflow-x: hidden;
            transition: all 0.3s ease;
        }

        /*
         * Floating background shapes
         */
        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 100px; height: 100px; top: 70%; left: 60%; animation-delay: 3s; }
        .shape:nth-child(5) { width: 70px; height: 70px; top: 30%; right: 40%; animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        /*
         * Navigation
         */
        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 20px;
            z-index: 100;
        }

        .back-button:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        /*
         * Theme Toggle Button
         */
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .theme-icon { font-size: 20px; color: var(--text-primary); }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .announcement-detail-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .announcement-detail-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--btn-gradient);
        }

        .announcement-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .announcement-badges {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .announcement-type {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .type-general {
            background: rgba(100, 181, 246, 0.2);
            color: var(--info-color);
            border: 1px solid rgba(100, 181, 246, 0.3);
        }

        .type-urgent {
            background: rgba(244, 67, 54, 0.2);
            color: var(--danger-color);
            border: 1px solid rgba(244, 67, 54, 0.3);
        }

        .type-academic {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }

        .type-event {
            background: rgba(255, 152, 0, 0.2);
            color: var(--warning-color);
            border: 1px solid rgba(255, 152, 0, 0.3);
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: rgba(76, 175, 80, 0.2);
            color: var(--success-color);
        }

        .status-inactive {
            background: rgba(158, 158, 158, 0.2);
            color: var(--text-muted);
        }

        .announcement-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        .announcement-meta {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(13, 71, 161, 0.1);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .meta-value {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 600;
        }

        .announcement-content {
            color: var(--text-primary);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 40px;
            white-space: pre-wrap;
            background: rgba(13, 71, 161, 0.05);
            padding: 25px;
            border-radius: 15px;
            border-left: 4px solid var(--info-color);
        }

        .action-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: var(--btn-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-warning {
            background: linear-gradient(135deg, var(--warning-color), #f57c00);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 152, 0, 0.3);
        }

        .btn-danger {
            background: linear-gradient(135deg, var(--danger-color), #d32f2f);
            color: white;
            box-shadow: 0 4px 15px rgba(244, 67, 54, 0.3);
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px var(--btn-hover-shadow);
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading::before {
            content: '';
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top: 4px solid var(--info-color);
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            color: var(--danger-color);
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }

        .success-message {
            background: rgba(76, 175, 80, 0.1);
            border: 1px solid rgba(76, 175, 80, 0.3);
            color: var(--success-color);
            padding: 15px 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(-10px);
            transition: all 0.3s ease;
        }

        .success-message.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .announcement-detail-card {
                padding: 25px;
            }
            
            .announcement-title {
                font-size: 24px;
            }
            
            .announcement-header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .announcement-meta {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            
            .action-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .btn {
                width: 200px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Back Button -->
    <a href="announcement.html" class="back-button" title="Back to Announcements">
        ←
    </a>

    <!-- Theme Toggle -->
    <div class="theme-toggle" onclick="toggleTheme()">
        <span class="theme-icon">🌓</span>
    </div>

    <div class="container">
        <div id="announcementContainer">
            <div class="loading">Loading announcement details...</div>
        </div>
    </div>

    <script>
        //const API_BASE_URL = "https://primarykey-production-6114.up.railway.app/";
      const API_BASE_URL = "http://localhost:5000/";
        let currentAnnouncement = null;

        // Theme Toggle Functionality
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute('data-theme');
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            body.setAttribute('data-theme', newTheme);
            
            try {
                sessionStorage.setItem('theme', newTheme);
            } catch (e) {
                console.log('Theme preference could not be saved');
            }
        }

        // Load saved theme
        function loadSavedTheme() {
            try {
                const savedTheme = sessionStorage.getItem('theme');
                if (savedTheme) {
                    document.body.setAttribute('data-theme', savedTheme);
                }
            } catch (e) {
                console.log('Could not load saved theme');
            }
        }

        // Initialize theme on page load
        loadSavedTheme();

        // Get URL parameter
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Get auth token
        function getAuthToken() {
            try {
                return sessionStorage.getItem('authToken') || localStorage.getItem('authToken');
            } catch (e) {
                return 'demo-token';
            }
        }

        // Format date
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        // Show success message
        function showSuccessMessage(message) {
            const existingMessage = document.querySelector('.success-message');
            if (existingMessage) {
                existingMessage.remove();
            }

            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.textContent = message;
            
            const container = document.getElementById('announcementContainer');
            container.parentNode.insertBefore(successDiv, container);
            
            // Trigger animation
            setTimeout(() => successDiv.classList.add('show'), 100);
            
            // Auto remove after 3 seconds
            setTimeout(() => {
                if (successDiv.parentNode) {
                    successDiv.remove();
                }
            }, 3000);
        }

        // Display announcement details
        function displayAnnouncementDetails(announcement) {
            const isActive = announcement.is_active;
            const typeClass = `type-${announcement.announcement_type}`;
            const statusClass = isActive ? 'status-active' : 'status-inactive';
            const statusText = isActive ? 'Active' : 'Inactive';
            
            const container = document.getElementById('announcementContainer');
            container.innerHTML = `
                <div class="announcement-detail-card">
                    <div class="announcement-header">
                        <div class="announcement-badges">
                            <div class="announcement-type ${typeClass}">
                                ${announcement.announcement_type}
                            </div>
                            <div class="status-badge ${statusClass}">
                                ${statusText}
                            </div>
                        </div>
                    </div>
                    
                    <h1 class="announcement-title">${announcement.title}</h1>
                    
                    <div class="announcement-meta">
                        <div class="meta-item">
                            <span class="meta-label">Posted By</span>
                            <span class="meta-value">${announcement.admin_name || 'Admin'}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Created</span>
                            <span class="meta-value">${formatDate(announcement.created_at)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Last Updated</span>
                            <span class="meta-value">${formatDate(announcement.updated_at)}</span>
                        </div>
                        <div class="meta-item">
                            <span class="meta-label">Status</span>
                            <span class="meta-value">${statusText}</span>
                        </div>
                    </div>
                    
                    <div class="announcement-content">${announcement.content}</div>
                    
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="editAnnouncement()">
                            ✏️ Edit Announcement
                        </button>
                        <button class="btn btn-warning" onclick="toggleAnnouncementStatus()">
                            ${isActive ? '🚫 Deactivate' : '👁️ Activate'}
                        </button>
                        <button class="btn btn-danger" onclick="deleteAnnouncement()">
                            🗑️ Delete Announcement
                        </button>
                    </div>
                </div>
            `;
        }

        // Fetch announcement details
        async function fetchAnnouncementDetails() {
            const announcementId = getUrlParameter('id');
            
            if (!announcementId) {
                document.getElementById('announcementContainer').innerHTML = `
                    <div class="error-message">
                        <strong>Invalid Request</strong><br>
                        No announcement ID provided in the URL.
                    </div>
                `;
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}api/announcements/${announcementId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                currentAnnouncement = data.announcement;
                displayAnnouncementDetails(currentAnnouncement);

            } catch (error) {
                console.error('Fetch announcement details error:', error);
                document.getElementById('announcementContainer').innerHTML = `
                    <div class="error-message">
                        <strong>Error Loading Announcement</strong><br>
                        ${error.message === 'Failed to fetch' ? 
                          'Unable to connect to the server. Please check your connection and try again.' : 
                          'Announcement not found or access denied.'
                        }
                    </div>
                `;
            }
        }

        // Edit announcement
        function editAnnouncement() {
            // Navigate back to announcements page with edit mode
            window.location.href = `announcements.html?edit=${currentAnnouncement.announcement_id}`;
        }

        // Toggle announcement status
        async function toggleAnnouncementStatus() {
            const action = currentAnnouncement.is_active ? 'deactivate' : 'activate';
            
            if (!confirm(`Are you sure you want to ${action} this announcement?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}api/announcements/${currentAnnouncement.announcement_id}/toggle-status`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccessMessage(`Announcement ${action}d successfully!`);
                    // Update current announcement status
                    currentAnnouncement.is_active = data.is_active;
                    // Refresh the display
                    displayAnnouncementDetails(currentAnnouncement);
                } else {
                    alert('Failed to toggle announcement status: ' + (data.error || 'Unknown error'));
                }

            } catch (error) {
                console.error('Toggle status error:', error);
                alert('Error toggling announcement status. Please try again.');
            }
        }

        // Delete announcement
        async function deleteAnnouncement() {
            if (!confirm('Are you sure you want to delete this announcement? This action cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}api/announcements/${currentAnnouncement.announcement_id}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                const data = await response.json();

                if (response.ok) {
                    showSuccessMessage('Announcement deleted successfully!');
                    // Redirect back to announcements page after a short delay
                    setTimeout(() => {
                        window.location.href = 'announcements.html';
                    }, 2000);
                } else {
                    alert('Failed to delete announcement: ' + (data.error || 'Unknown error'));
                }

            } catch (error) {
                console.error('Delete announcement error:', error);
                alert('Error deleting announcement. Please try again.');
            }
        }

        // Auto-load announcement details on page load
        window.addEventListener('load', fetchAnnouncementDetails);
    </script>
</body>
</html>
