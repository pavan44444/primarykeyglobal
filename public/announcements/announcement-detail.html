<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Announcement Details</title>
    <link rel="icon" type="image/png" href="../../logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="../assets/sidebar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .back-button {
            position: fixed;
            top: 90px;
            left: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            color: var(--text-primary);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            z-index: 100;
        }

        .back-button:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
            border-color: #0284c7;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }

        .announcement-detail {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .announcement-detail::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, #0284c7, #0ea5e9, #06b6d4);
        }

        .detail-header {
            margin-bottom: 30px;
        }

        .detail-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 36px;
            font-weight: 900;
            margin-bottom: 20px;
            line-height: 1.3;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .detail-meta {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            padding: 16px 20px;
            background: rgba(2, 132, 199, 0.1);
            border-radius: 12px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        .meta-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .meta-icon {
            font-size: 18px;
        }

        .detail-image {
            width: 100%;
            max-height: 450px;
            object-fit: cover;
            border-radius: 16px;
            margin: 30px 0;
            cursor: zoom-in;
            transition: all 0.3s ease;
            border: 1px solid var(--glass-border);
        }

        .detail-image:hover {
            opacity: 0.9;
            transform: scale(1.01);
        }

        .detail-content {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .loading {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid var(--glass-border);
            border-top: 4px solid #0284c7;
            border-radius: 50%;
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            text-align: center;
            padding: 100px 20px;
            color: var(--text-secondary);
        }

        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .error-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .error-text {
            font-size: 16px;
            opacity: 0.8;
        }

        /* Image Modal */
        .image-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
        }

        .image-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .image-modal-content {
            max-width: 95%;
            max-height: 95%;
            object-fit: contain;
            animation: zoomIn 0.3s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .image-modal-close {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #fff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2001;
        }

        .image-modal-close:hover {
            transform: scale(1.2);
        }

        @media (max-width: 768px) {
            .back-button {
                top: 80px;
                left: 10px;
                padding: 10px 16px;
                font-size: 13px;
            }

            .container {
                margin-top: 20px;
                padding: 10px;
            }

            .announcement-detail {
                padding: 25px;
            }

            .detail-title {
                font-size: 28px;
            }

            .detail-meta {
                flex-direction: column;
                gap: 12px;
            }

            .detail-image {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <a href="announcements.html" class="back-button">
        ← Back to Announcements
    </a>

    <div class="container">
        <div id="announcementContainer">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p style="font-size: 18px; font-weight: 600; margin-top: 10px;">Loading announcement details...</p>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal" onclick="closeImageModal()">
        <span class="image-modal-close">&times;</span>
        <img class="image-modal-content" id="modalImage">
    </div>

    <script>
        const API_BASE_URL = "http://localhost:5000/";
      //  const API_BASE_URL = "https://primarykey-production-6114.up.railway.app/";

        function getAuthToken() {
            try {
                return sessionStorage.getItem('authToken') || localStorage.getItem('authToken');
            } catch (e) {
                return 'demo-token';
            }
        }

        function getAnnouncementIdFromUrl() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('id');
        }

        function formatDate(dateString) {
            if (!dateString) return 'Date not available';
            try {
                const date = new Date(dateString);
                if (isNaN(date.getTime())) return 'Invalid date';
                return date.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch (error) {
                return 'Invalid date';
            }
        }

        function openImageModal(imageSrc) {
            document.getElementById('modalImage').src = imageSrc;
            document.getElementById('imageModal').classList.add('active');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('active');
        }

        function displayAnnouncement(announcement) {
            const container = document.getElementById('announcementContainer');
            let imageUrl = null;
            if (announcement.image_url) {
                if (announcement.image_url.startsWith("http")) {
                    imageUrl = announcement.image_url;
                } else if (announcement.image_url.startsWith("/")) {
                    imageUrl = API_BASE_URL + announcement.image_url.substring(1);
                } else {
                    imageUrl = API_BASE_URL + announcement.image_url;
                }
            }
            const escapedImageUrl = imageUrl ? imageUrl.replace(/'/g, "\\'") : '';

            container.innerHTML = `
                <div class="announcement-detail">
                    <div class="detail-header">
                        <h1 class="detail-title">${announcement.title || 'Untitled'}</h1>
                        <div class="detail-meta">
                            <div class="meta-item">
                                <span class="meta-icon">👤</span>
                                <span>${announcement.posted_by || 'Admin'}</span>
                            </div>
                            <div class="meta-item">
                                <span class="meta-icon">📅</span>
                                <span>${formatDate(announcement.created_at)}</span>
                            </div>
                            ${announcement.time_ago ? `
                            <div class="meta-item">
                                <span class="meta-icon">🕒</span>
                                <span>${announcement.time_ago}</span>
                            </div>
                            ` : ''}
                        </div>
                    </div>

                    ${imageUrl ? `
                    <img src="${imageUrl}" 
                         alt="${announcement.title}" 
                         class="detail-image" 
                         onclick="openImageModal('${escapedImageUrl}')"
                         onerror="this.style.display='none'">
                    ` : ''}

                    <div class="detail-content">${announcement.content || 'No content available'}</div>
                </div>
            `;
        }

        function showError(message) {
            const container = document.getElementById('announcementContainer');
            container.innerHTML = `
                <div class="error-message">
                    <div class="error-icon">❌</div>
                    <div class="error-title">Error Loading Announcement</div>
                    <div class="error-text">${message}</div>
                </div>
            `;
        }

        async function fetchAnnouncementDetail() {
            const announcementId = getAnnouncementIdFromUrl();

            if (!announcementId) {
                showError('No announcement ID provided');
                return;
            }

            try {
                const response = await fetch(`${API_BASE_URL}api/announcements/${announcementId}`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${getAuthToken()}`
                    }
                });

                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error('Announcement not found');
                    }
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                if (data.announcement) {
                    displayAnnouncement(data.announcement);
                } else {
                    throw new Error('Invalid response format');
                }

            } catch (error) {
                console.error('Fetch announcement error:', error);
                showError(error.message || 'Failed to load announcement details');
            }
        }

        window.addEventListener('load', fetchAnnouncementDetail);

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeImageModal();
            }
        });
    </script>
    <script src="../assets/sidebar.js"></script>
</body>
</html>
