<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Quizzes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f23, #0d47a1);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #64b5f6, #42a5f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .breadcrumb-separator {
      color: #64b5f6;
    }

    .concepts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .concept-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .concept-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #64b5f6, #42a5f5, #1e88e5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .concept-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .concept-card:hover::before {
      opacity: 1;
    }

    .concept-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .concept-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #64b5f6;
    }

    .difficulty-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .difficulty-beginner {
      background: rgba(76, 175, 80, 0.2);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .difficulty-intermediate {
      background: rgba(255, 193, 7, 0.2);
      color: #ffb74d;
      border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .difficulty-advanced {
      background: rgba(244, 67, 54, 0.2);
      color: #e57373;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }

    .concept-description {
      font-size: 0.95rem;
      line-height: 1.6;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .quiz-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-item {
      text-align: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #64b5f6;
      display: block;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.8rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quiz-button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(45deg, #1e88e5, #42a5f5);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quiz-button:hover {
      background: linear-gradient(45deg, #1565c0, #1e88e5);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 136, 229, 0.4);
    }

    .quiz-button:active {
      transform: translateY(-1px);
    }

    .quiz-button:disabled {
      background: rgba(255, 255, 255, 0.1);
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .topics-overview {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .overview-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #64b5f6;
    }

    .overview-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .overview-stat {
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
    }

    .overview-stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #42a5f5;
      display: block;
      margin-bottom: 8px;
    }

    .overview-stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 200px;
      font-size: 1.2rem;
      opacity: 0.8;
    }

    .error {
      background: rgba(244, 67, 54, 0.1);
      border: 1px solid rgba(244, 67, 54, 0.3);
      color: #e57373;
      padding: 30px;
      border-radius: 16px;
      margin: 20px 0;
      text-align: center;
    }

    .error h3 {
      font-size: 1.5rem;
      margin-bottom: 15px;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top: 3px solid #64b5f6;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .auth-section {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .auth-title {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #64b5f6;
    }

    .token-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 8px;
      color: white;
      font-size: 0.9rem;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }

    .token-input:focus {
      outline: none;
      border-color: #64b5f6;
      background: rgba(255, 255, 255, 0.08);
    }

    .token-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
    }

    .auth-controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .auth-status {
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .auth-status.connected {
      background: rgba(76, 175, 80, 0.2);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .auth-status.disconnected {
      background: rgba(244, 67, 54, 0.2);
      color: #e57373;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }

    @media (max-width: 768px) {
      .concepts-grid {
        grid-template-columns: 1fr;
      }
      
      .quiz-stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      
      .overview-stats {
        grid-template-columns: 1fr;
      }
      
      .main-title {
        font-size: 2rem;
      }

      .auth-controls {
        flex-direction: column;
        align-items: stretch;
      }
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-2px);
    }

    /* Quiz card animation */
    .concept-card {
      animation: slideUp 0.6s ease forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    .concept-card:nth-child(1) { animation-delay: 0.1s; }
    .concept-card:nth-child(2) { animation-delay: 0.2s; }
    .concept-card:nth-child(3) { animation-delay: 0.3s; }
    .concept-card:nth-child(4) { animation-delay: 0.4s; }
    .concept-card:nth-child(5) { animation-delay: 0.5s; }
    .concept-card:nth-child(6) { animation-delay: 0.6s; }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="#" class="back-button" onclick="history.back()">
      ← Back to Topics
    </a>

    <div class="header">
      <h1 class="main-title" id="quizHeading">Available Quizzes</h1>
      <div class="breadcrumb" id="breadcrumb">
        <span>Home</span>
        <span class="breadcrumb-separator">›</span>
        <span>Quizzes</span>
      </div>
    </div>

    <div id="noTokenMessage" class="error" style="display:none; margin-bottom: 20px;">
      <h3>Authentication Required</h3>
      <p>Please log in to access quizzes.</p>
    </div>

    <div class="topics-overview" id="overviewSection" style="display: none;">
      <h2 class="overview-title">Quiz Overview</h2>
      <div class="overview-stats">
        <div class="overview-stat">
          <span class="overview-stat-number" id="totalQuizzes">-</span>
          <span class="overview-stat-label">Total Quizzes</span>
        </div>
        <div class="overview-stat">
          <span class="overview-stat-number" id="totalQuestions">-</span>
          <span class="overview-stat-label">Total Questions</span>
        </div>
        <div class="overview-stat">
          <span class="overview-stat-number" id="totalPoints">-</span>
          <span class="overview-stat-label">Total Points</span>
        </div>
        <div class="overview-stat">
          <span class="overview-stat-number" id="avgTime">-</span>
          <span class="overview-stat-label">Avg Time (min)</span>
        </div>
      </div>
    </div>

    <div id="loadingSection" class="loading" style="display: none;">
      <div class="spinner"></div>
      Loading quizzes...
    </div>

    <div id="errorSection" class="error" style="display: none;">
      <h3>Error Loading Quizzes</h3>
      <p id="errorMessage">Unable to load quiz data. Please try again later.</p>
      <button class="quiz-button" onclick="loadQuizzes()" style="margin-top: 15px; max-width: 200px;">Retry</button>
    </div>

    <div class="concepts-grid" id="conceptsGrid" style="display: none;">
      <!-- Quiz cards will be dynamically loaded here -->
    </div>
  </div>

  <script>
   // const API_BASE_URL = 'http://localhost:5000/api';
    let quizzesData = [];
    let currentToken = '';

    function getDifficultyLevel(questions) {
      if (questions <= 3) return 'beginner';
      if (questions <= 7) return 'intermediate';
      return 'advanced';
    }

    function generateDescription(topic, questions) {
      const descriptions = [
        `Master the fundamentals of ${topic} with ${questions} comprehensive questions.`,
        `Test your knowledge in ${topic} through ${questions} challenging questions.`,
        `Enhance your understanding of ${topic} concepts with this ${questions}-question quiz.`,
        `Evaluate your skills in ${topic} with ${questions} well-crafted questions.`
      ];
      return descriptions[Math.floor(Math.random() * descriptions.length)];
    }

    async function fetchQuizzes() {
      if (!currentToken) {
        throw new Error('Authentication token not found. Please log in.');
      }

      const response = await fetch(`${API_URL}/quizzes`, {
        headers: {
          'Authorization': `Bearer ${currentToken}`,
          'Content-Type': 'application/json'
        }
      });

      if (!response.ok) {
        if (response.status === 401) {
          throw new Error('Invalid or expired token. Please log in again.');
        } else if (response.status === 403) {
          throw new Error('Access denied. You do not have permission to access this resource.');
        } else {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
      }

      const data = await response.json();

      if (data.success && data.quizzes) {
        return data.quizzes;
      } else {
        throw new Error('Invalid API response format');
      }
    }

    function displayError(message) {
      document.getElementById('loadingSection').style.display = 'none';
      document.getElementById('conceptsGrid').style.display = 'none';
      document.getElementById('overviewSection').style.display = 'none';
      document.getElementById('errorSection').style.display = 'block';
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('noTokenMessage').style.display = 'none';
    }

    function updateOverviewStats(quizzes) {
      const totalQuizzes = quizzes.length;
      const totalQuestions = quizzes.reduce((sum, quiz) => sum + quiz.no_of_questions, 0);
      const totalPoints = quizzes.reduce((sum, quiz) => sum + quiz.total_points, 0);
      const avgTime = Math.round(quizzes.reduce((sum, quiz) => sum + quiz.time_seconds, 0) / quizzes.length / 60);

      document.getElementById('totalQuizzes').textContent = totalQuizzes;
      document.getElementById('totalQuestions').textContent = totalQuestions;
      document.getElementById('totalPoints').textContent = totalPoints;
      document.getElementById('avgTime').textContent = `${avgTime} min`;
    }

    function renderQuizCards(quizzes) {
      const conceptsGrid = document.getElementById('conceptsGrid');
      conceptsGrid.innerHTML = '';

      quizzes.forEach((quiz, index) => {
        const difficulty = getDifficultyLevel(quiz.no_of_questions);
        const description = generateDescription(quiz.topic, quiz.no_of_questions);
        const timeMinutes = Math.ceil(quiz.time_seconds / 60);

        const quizCard = document.createElement('div');
        quizCard.className = 'concept-card';
        quizCard.style.animationDelay = `${(index + 1) * 0.1}s`;

        quizCard.innerHTML = `
          <div class="concept-header">
            <h3 class="concept-title">${quiz.topic}</h3>
            <span class="difficulty-badge difficulty-${difficulty}">${difficulty}</span>
          </div>
          <p class="concept-description">${description}</p>
          <div class="quiz-stats">
            <div class="stat-item">
              <span class="stat-number">${timeMinutes}</span>
              <span class="stat-label">Minutes</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">${quiz.no_of_questions}</span>
              <span class="stat-label">Questions</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">${quiz.total_points}</span>
              <span class="stat-label">Points</span>
            </div>
          </div>
          <div class="quiz-stats">
            <div class="stat-item">
              <span class="stat-number">${quiz.points_per_question}</span>
              <span class="stat-label">Points/Q</span>
            </div>
          </div>
          <button class="quiz-button" onclick="startQuiz(${quiz.quiz_id}, '${quiz.topic}', ${index})">
            Start Quiz
          </button>
        `;

        conceptsGrid.appendChild(quizCard);
      });
    }

    async function loadQuizzes() {
      document.getElementById('errorSection').style.display = 'none';
      document.getElementById('noTokenMessage').style.display = 'none';

      currentToken = localStorage.getItem('authToken');
      if (!currentToken) {
        document.getElementById('noTokenMessage').style.display = 'block';
        return;
      }

      document.getElementById('loadingSection').style.display = 'flex';
      document.getElementById('conceptsGrid').style.display = 'none';
      document.getElementById('overviewSection').style.display = 'none';

      try {
        quizzesData = await fetchQuizzes();

        if (quizzesData.length === 0) {
          throw new Error('No quizzes available');
        }

        updateOverviewStats(quizzesData);
        renderQuizCards(quizzesData);

        document.getElementById('loadingSection').style.display = 'none';
        document.getElementById('overviewSection').style.display = 'block';
        document.getElementById('conceptsGrid').style.display = 'grid';
      } catch (error) {
        displayError(error.message || 'Failed to load quizzes. Please check your connection and try again.');
      }
    }

    function startQuiz(quizId, quizTopic, index) {
      const quiz = quizzesData[index];
      sessionStorage.setItem('currentQuiz', JSON.stringify(quiz));
      sessionStorage.setItem('authToken', currentToken);
      window.location.href = `quizinterface.html?quiz_id=${quizId}`;
    }

    window.addEventListener('DOMContentLoaded', loadQuizzes);
  </script>
</body>

</html>
