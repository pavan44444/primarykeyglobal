<!DOCTYPE html>
<html lang="en">
<head>
  <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Articles - PRIMARY KEY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/sidebar.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      min-height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
    }

    .page {
      display: flex;
      flex-direction: column;
      padding: 20px 32px 40px;
      gap: 14px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Breadcrumb */
    .breadcrumb {
      font-size: 12px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .breadcrumb a {
      color: var(--success-text);
      text-decoration: none;
      font-weight: 600;
    }

    .breadcrumb a:hover {
      text-decoration: underline;
    }

    /* Header */
    .header {
      text-align: center;
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .article-header-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--btn-gradient);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }

    .page-title {
      font-size: 26px;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
    }

    .page-subtitle {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 6px;
      max-width: 620px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.5;
    }

    /* Search bar */
    .search-bar {
      width: 100%;
      max-width: 360px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      outline: none;
      transition: all 0.2s ease;
    }

    .search-bar input::placeholder {
      color: var(--text-muted);
    }

    .search-bar input:focus {
      border-color: var(--input-focus-border);
      background: var(--input-focus-bg);
    }

    /* Grid + cards */
    .topic-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .topic-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid #003882;
      border-radius: 14px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      min-height: 220px;
      position: relative;
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .topic-card:hover {
      transform: translateY(-3px);
      border-color: var(--input-focus-border);
    }

    .topic-card-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
    }

    .topic-icon {
      width: 44px;
      height: 44px;
      min-width: 44px;
      border-radius: 11px;
      background: var(--btn-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      color: white;
      flex-shrink: 0;
    }

    .topic-text {
      min-width: 0;
      flex: 1;
    }

    .topic-text h3 {
      margin: 0 0 3px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text-primary);
    }

    .topic-type {
      font-size: 10.5px;
      color: var(--success-text);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    /* Circular progress ring */
    /* .progress-ring-wrap {
      position: relative;
      width: 46px;
      height: 46px;
      flex-shrink: 0;
    } */

    /* .progress-ring-wrap svg {
      transform: rotate(-90deg);
      width: 46px;
      height: 46px;
    } */

    /* .progress-ring-bg {
      fill: none;
      stroke: var(--input-bg);
      stroke-width: 4;
    } */

    /* .progress-ring-fill {
      fill: none;
      stroke: var(--success-text);
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s ease;
    } */

    /* .progress-ring-label {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 800;
      color: var(--text-primary);
    } */

    /* Description */
    .topic-description {
      margin: 0;
      font-size: 12.5px;
      line-height: 1.55;
      color: var(--text-secondary);
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    /* Footer actions */
    .topic-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--glass-border);
    }

    .topic-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 10px 8px;
      border: 1px solid var(--glass-border);
      border-radius: 9px;
      background: transparent;
      color: var(--text-primary);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 700;
      transition: all 0.2s ease;
      cursor: pointer;
      background-color: #003882;
    }

    .topic-action:hover {
      border-color: var(--input-focus-border);
      background: var(--input-focus-bg);
      transform: translateY(-1px);
    }

    .action-icon {
      font-size: 15px;
      line-height: 1;
    }

    /* Loading/Error/Empty states */
    .loading, .error, .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 20px;
      border-radius: 14px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      text-align: center;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--input-bg);
      border-top: 4px solid var(--success-text);
      border-radius: 50%;
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-bottom: 14px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: var(--error-bg);
      border: 2px solid var(--error-border);
      color: var(--error-text);
    }

    .error button {
      margin-top: 12px;
      padding: 8px 18px;
      border-radius: 8px;
      border: 1px solid var(--error-border);
      background: transparent;
      color: var(--error-text);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .error button:hover {
      background: var(--error-border);
      color: white;
    }

    .no-data p {
      color: var(--text-secondary);
      font-size: 13px;
    }

    .back-link {
      display: inline-block;
      margin-top: 10px;
      color: var(--success-text);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      .page {
        padding: 14px 16px 30px;
        gap: 10px;
      }

      .page-title {
        font-size: 20px;
      }

      .topic-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="breadcrumb">
      <a href="tutorials.html">Tutorials</a>
      <span id="breadcrumbCurrent"></span>
    </div>

    <div class="header">
      <div class="header-top">
        <div class="article-header-icon">📖</div>
        <h1 class="page-title" id="tutorialTitle">Loading...</h1>
      </div>
      <p class="page-subtitle" id="tutorialDescription"></p>
    </div>

    <!-- <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search articles..." autocomplete="off">
    </div> -->

    <div id="content-area">
      <div class="loading" id="loadingState">
        <div class="loading-spinner"></div>
        <p style="color: var(--text-secondary); font-size: 14px; font-weight: 600;">Loading articles...</p>
      </div>
    </div>
  </div>

  <script>
  (function () {

    const API_BASE = '';

    const contentArea = document.getElementById('content-area');
    const searchInput = document.getElementById('searchInput');

    let allTopics = [];

    const params = new URLSearchParams(window.location.search);
    const tutorialId = params.get('tutorial_id');

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str || '';
      return div.innerHTML;
    }

    function getProgress(t) {
      const raw = t.progress_percentage ?? t.progress ?? t.completion_percentage ?? t.completion ?? 0;
      const n = Number(raw);
      if (isNaN(n)) return 0;
      return Math.min(100, Math.max(0, Math.round(n)));
    }

    function progressRing(pct) {
      const radius = 20;
      const circumference = 2 * Math.PI * radius;
      const offset = circumference - (pct / 100) * circumference;
      return `
        <div class="progress-ring-wrap" title="${pct}% complete">
          <svg viewBox="0 0 46 46">
            <circle class="progress-ring-bg" cx="23" cy="23" r="${radius}"></circle>
            <circle class="progress-ring-fill" cx="23" cy="23" r="${radius}"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${offset}"></circle>
          </svg>
          <div class="progress-ring-label">${pct}%</div>
        </div>
      `;
    }

    function renderTopics(list) {
      if (list.length === 0) {
        contentArea.innerHTML = `
          <div class="no-data">
            <div style="font-size: 42px; margin-bottom: 10px;">📖</div>
            <h3 style="font-size: 18px; margin-bottom: 8px; color: var(--text-primary);">No Matches</h3>
            <p>No articles match your search.</p>
          </div>`;
        return;
      }

      contentArea.innerHTML = `
        <div class="topic-grid">
          ${list.map((t) => {
            const pct = getProgress(t);
            return `
            <div class="topic-card">
              <div class="topic-card-header">
                <div class="topic-icon">📖</div>
                <div class="topic-text">
                  <h3>${escapeHtml(t.title)}</h3>
                  <div class="topic-type">Article &amp; Quiz</div>
                </div>
                <!-- ${progressRing(pct)} -->
              </div>

              <p class="topic-description">
                ${escapeHtml(t.description || 'Read this article to understand the concept and strengthen your knowledge.')}
              </p>

              <div class="topic-footer">
                <a class="topic-action" href="article.html?topic_id=${encodeURIComponent(t.topic_id)}">
                  <span class="action-icon">📖</span>
                  <span>Article</span>
                </a>
                <a class="topic-action" href="quizinterface.html?topic_id=${encodeURIComponent(t.topic_id)}">
                  <span class="action-icon">📝</span>
                  <span>Quiz</span>
                </a>
              </div>
            </div>
          `;
          }).join('')}
        </div>`;
    }

    function renderError(message, showBack) {
      contentArea.innerHTML = `
        <div class="error">
          <h3 style="font-size: 18px; margin-bottom: 8px;">⚠️ Error</h3>
          <p style="font-size: 13px;">${escapeHtml(message)}</p>
          <button type="button" onclick="location.reload()">Retry</button>
          ${showBack ? `<br><a class="back-link" href="tutorials.html">← Back to tutorials</a>` : ''}
        </div>`;
    }

    async function loadTutorialInfo() {
      try {
        const res = await fetch(`${API_BASE}/api/tutorials/${encodeURIComponent(tutorialId)}`);
        const data = await res.json();

        if (!res.ok || !data.success) {
          document.getElementById('tutorialTitle').textContent = 'Tutorial not found';
          document.getElementById('tutorialDescription').textContent = '';
          return;
        }

        const tutorial = data.tutorial;
        document.getElementById('tutorialTitle').textContent = tutorial.title;
        document.getElementById('tutorialDescription').textContent = tutorial.description || '';
        document.getElementById('breadcrumbCurrent').textContent = ' / ' + tutorial.title;
        document.title = `${tutorial.title} | Articles | Primary Key`;
      } catch (err) {
        console.error('Error loading tutorial info:', err);
        document.getElementById('tutorialTitle').textContent = 'Articles';
      }
    }

    async function loadTopics() {
      try {
        const res = await fetch(`${API_BASE}/api/topics/tutorial/${encodeURIComponent(tutorialId)}`);
        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.message || 'Failed to load articles');
        }

        allTopics = data.topics || [];

        if (allTopics.length === 0) {
          contentArea.innerHTML = `
            <div class="no-data">
              <div style="font-size: 42px; margin-bottom: 10px;">📖</div>
              <h3 style="font-size: 18px; margin-bottom: 8px; color: var(--text-primary);">No Articles Yet</h3>
              <p>No articles published yet for this tutorial.</p>
              <a class="back-link" href="tutorials.html">← Back to tutorials</a>
            </div>`;
          return;
        }

        renderTopics(allTopics);
      } catch (err) {
        console.error('Error loading topics:', err);
        renderError('Could not load articles. Please check your connection and try again.', true);
      }
    }

    // searchInput.addEventListener('input', function (e) {
    //   const q = e.target.value.trim().toLowerCase();
    //   const filtered = allTopics.filter(t =>
    //     (t.title || '').toLowerCase().includes(q) ||
    //     (t.description || '').toLowerCase().includes(q)
    //   );
    //   renderTopics(filtered);
    // });

    if (!tutorialId) {
      document.getElementById('tutorialTitle').textContent = 'No tutorial selected';
      contentArea.innerHTML = `
        <div class="no-data">
          <p>No tutorial was specified.</p>
          <a class="back-link" href="tutorials.html">← Back to tutorials</a>
        </div>`;
    } else {
      loadTutorialInfo();
      loadTopics();
    }

  })();
  </script>
  <script src="../assets/sidebar.js"></script>
</body>
</html>
