<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Interview Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
  (function() {
    const savedTheme = localStorage.getItem("theme") || "dark"; 
    document.documentElement.setAttribute("data-theme", savedTheme);
  })();
</script>

    <link rel="stylesheet" href="../assets/theme.css">
    <link rel="stylesheet" href="../assets/sidebar.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .form-container {
            width: 100%;
            max-width: 900px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            margin: 20px 0;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 8px;
            text-align: center;
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .form-container {
                padding: 30px 20px;
            }
            
            .form-row {
                grid-template-columns: 1fr;
            }
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--text-secondary);
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--input-focus-border);
            background: var(--input-focus-bg);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }
        
        .round-info-container {
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            background: rgba(2, 132, 199, 0.05);
        }

        .round-tab-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .round-tab {
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px 8px 0 0;
            background: rgba(2, 132, 199, 0.1);
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .round-tab:hover {
            background: rgba(2, 132, 199, 0.15);
        }

        .round-tab.active {
            background: var(--btn-gradient);
            color: white;
            border-color: #0284c7;
            transform: translateY(-2px);
        }

        .round-tab-content {
            display: none;
        }

        .round-tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            margin-top: 30px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.3);
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: scale(0.98);
        }

        .back-button {
            position: fixed;
            top: 90px;
            left: 20px;
            padding: 12px 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        .back-button:hover {
            transform: translateX(-5px);
            box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
            border-color: #0284c7;
        }

        .required-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .back-button {
                top: 80px;
                left: 10px;
                padding: 10px 16px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <a href="view-experiences.html" class="back-button">
        ← Back to Experiences
    </a>

    <div class="form-container">
        <h1>Share Your Interview Experience</h1>
        <p class="subtitle">Help others by sharing your interview journey</p>
        
        <form id="interviewExperienceForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="companyName">Company Name *</label>
                    <input type="text" id="companyName" name="company_name" required>
                </div>
                
                <div class="form-group">
                    <label for="passoutYear">Passout Year *</label>
                    <input type="number" id="passoutYear" name="passout_year" min="2020" max="2030" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="jobRole">Job Role *</label>
                    <input type="text" id="jobRole" name="job_role" placeholder="e.g., Software Engineer" required>
                </div>

                <div class="form-group">
                    <label for="jobLocation">Job Location *</label>
                    <input type="text" id="jobLocation" name="job_location" placeholder="e.g., Bangalore" required>
                </div>
            </div>

            <div class="form-group">
                <label for="packageOffered">Package Offered (in LPA)</label>
                <input type="number" id="packageOffered" name="package_offered" step="0.01" min="0" placeholder="e.g., 8.5">
            </div>

            <div class="form-group">
                <label for="rounds">Number of Interview Rounds *</label>
                <input type="number" id="rounds" name="rounds" min="1" max="10" value="1" required>
            </div>
            
            <div id="round-fields-container" style="display: none;">
                <label style="font-size: 16px; font-weight: 700; margin-bottom: 15px; display: block;">Round Details</label>
                <div class="round-tab-container" id="round-tabs"></div>
                <div id="round-content"></div>
            </div>

            <div class="form-group">
                <label for="experienceSummary">Overall Experience Summary *</label>
                <textarea id="experienceSummary" name="experience_summary" placeholder="Describe your overall interview experience, tips, and key takeaways..." required></textarea>
            </div>
            
            <button type="submit" class="submit-btn">Submit Experience</button>
            <p class="required-note">* Required fields</p>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const roundsInput = document.getElementById('rounds');
            const roundFieldsContainer = document.getElementById('round-fields-container');
            const roundTabsContainer = document.getElementById('round-tabs');
            const roundContentContainer = document.getElementById('round-content');
            const form = document.getElementById('interviewExperienceForm');

            const roundTypes = ['Aptitude', 'DSA', 'Technical', 'HR', 'System Design', 'Coding', 'Group Discussion'];

            function generateRoundFields(numRounds) {
                if (numRounds > 0) {
                    roundFieldsContainer.style.display = 'block';
                    roundTabsContainer.innerHTML = '';
                    roundContentContainer.innerHTML = '';

                    for (let i = 1; i <= numRounds; i++) {
                        const tab = document.createElement('div');
                        tab.className = 'round-tab';
                        tab.textContent = `Round ${i}`;
                        tab.dataset.round = i;
                        roundTabsContainer.appendChild(tab);

                        const content = document.createElement('div');
                        content.className = 'round-tab-content';
                        content.dataset.round = i;
                        content.innerHTML = `
                            <div class="round-info-container">
                                <div class="form-group">
                                    <label for="roundType-${i}">Round Type *</label>
                                    <select id="roundType-${i}" name="round_type_${i}" required>
                                        <option value="">Select Round Type</option>
                                        ${roundTypes.map(type => `<option value="${type}">${type}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="roundDate-${i}">Round Date (Optional)</label>
                                    <input type="date" id="roundDate-${i}" name="round_date_${i}">
                                </div>
                                <div class="form-group">
                                    <label for="roundDescription-${i}">Round ${i} Description *</label>
                                    <textarea id="roundDescription-${i}" name="round_description_${i}" 
                                        placeholder="Describe what happened in this round, questions asked, difficulty level, tips..." required></textarea>
                                </div>
                            </div>
                        `;
                        roundContentContainer.appendChild(content);
                    }

                    if (document.querySelector('.round-tab')) {
                        document.querySelector('.round-tab').classList.add('active');
                        document.querySelector('.round-tab-content').classList.add('active');
                    }
                } else {
                    roundFieldsContainer.style.display = 'none';
                }
            }

            roundsInput.addEventListener('input', (e) => {
                const numRounds = parseInt(e.target.value);
                if (numRounds >= 1 && numRounds <= 10) {
                    generateRoundFields(numRounds);
                } else if (numRounds < 1) {
                    roundFieldsContainer.style.display = 'none';
                }
            });

            roundTabsContainer.addEventListener('click', (e) => {
                const clickedTab = e.target.closest('.round-tab');
                if (clickedTab) {
                    document.querySelectorAll('.round-tab').forEach(tab => tab.classList.remove('active'));
                    document.querySelectorAll('.round-tab-content').forEach(content => content.classList.remove('active'));
                    
                    clickedTab.classList.add('active');
                    document.querySelector(`.round-tab-content[data-round="${clickedTab.dataset.round}"]`).classList.add('active');
                }
            });

            generateRoundFields(1);

            form.addEventListener('submit', async (e) => {
                e.preventDefault();

                const submitBtn = document.querySelector('.submit-btn');
                submitBtn.textContent = 'Submitting...';
                submitBtn.disabled = true;

                const formData = new FormData(form);
                const numRounds = parseInt(formData.get('rounds'));
                
                const data = {
                    company_name: formData.get('company_name'),
                    job_role: formData.get('job_role'),
                    job_location: formData.get('job_location'),
                    package_offered: formData.get('package_offered') ? parseFloat(formData.get('package_offered')) : null,
                    experience_summary: formData.get('experience_summary'),
                    passout_year: parseInt(formData.get('passout_year')),
                    rounds: []
                };

                for (let i = 1; i <= numRounds; i++) {
                    const roundType = document.getElementById(`roundType-${i}`).value;
                    const roundDescription = document.getElementById(`roundDescription-${i}`).value;
                    const roundDate = document.getElementById(`roundDate-${i}`).value;
                    
                    if (roundType && roundDescription) {
                        data.rounds.push({
                            round_number: i,
                            round_type: roundType,
                            round_description: roundDescription,
                            round_date: roundDate || null
                        });
                    }
                }

                const API_BASE_URL = "https://primarykey-production-6114.up.railway.app/";
                const token = localStorage.getItem('authToken');

                try {
                    const response = await fetch(`${API_BASE_URL}api/interviews/add`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}` 
                        },
                        body: JSON.stringify(data)
                    });

                    const responseData = await response.json();

                    if (response.ok) {
                        alert('Interview experience added successfully!');
                        window.location.href = 'view-experiences.html';
                    } else {
                        alert(`Failed to add experience: ${responseData.message || 'Unknown error'}`);
                    }
                } catch (error) {
                    console.error('Network Error:', error);
                    alert('Network error occurred. Please check your connection and try again.');
                } finally {
                    submitBtn.textContent = 'Submit Experience';
                    submitBtn.disabled = false;
                }
            });
        });
    </script>
    <script src="../assets/sidebar.js"></script>
</body>
</html>
