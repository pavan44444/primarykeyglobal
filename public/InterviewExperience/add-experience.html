<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Interview Experience</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --card-bg: rgba(26, 26, 46, 0.3);
            --card-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.3);
            --shape-bg: rgba(13, 71, 161, 0.1);
            --input-bg: rgba(255, 255, 255, 0.1);
            --input-border: rgba(255, 255, 255, 0.2);
            --tab-bg: rgba(255, 255, 255, 0.05);
            --tab-active-bg: rgba(255, 255, 255, 0.1);
            --tab-border-color: rgba(255, 255, 255, 0.3);
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.2);
            --shape-bg: rgba(255, 255, 255, 0.2);
            --input-bg: rgba(0, 0, 0, 0.05);
            --input-border: rgba(0, 0, 0, 0.2);
            --tab-bg: rgba(0, 0, 0, 0.05);
            --tab-active-bg: rgba(0, 0, 0, 0.1);
            --tab-border-color: rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .theme-icon { font-size: 20px; color: var(--text-primary); }

        .form-container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            text-align: left;
            z-index: 1;
        }

        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #1976d2;
            background: rgba(25, 118, 210, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }
        
        .round-info-container {
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.05);
        }

        .round-tab-container {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--tab-border-color);
        }

        .round-tab {
            padding: 10px 20px;
            cursor: pointer;
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
            background-color: var(--tab-bg);
            color: var(--text-secondary);
            font-weight: 500;
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .round-tab.active {
            background-color: var(--tab-active-bg);
            color: var(--text-primary);
            border-bottom: 2px solid var(--btn-gradient);
        }

        .round-tab-content {
            display: none;
        }

        .round-tab-content.active {
            display: block;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 30px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--btn-hover-shadow);
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }

        /* Modern Popup Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            transform: scale(0.7) translateY(-50px);
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .modal-overlay.active .modal {
            transform: scale(1) translateY(0);
        }

        .modal::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: var(--btn-gradient);
        }

        .modal-icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
            animation: bounce 0.6s ease-out;
        }

        .modal-icon.success {
            color: var(--success-color);
        }

        .modal-icon.error {
            color: #f44336;
        }

        @keyframes bounce {
            0% { transform: scale(0) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--text-primary);
        }

        .modal-message {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .modal-btn {
            padding: 12px 30px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            min-width: 120px;
        }

        .modal-btn-primary {
            background: var(--btn-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px var(--btn-hover-shadow);
        }

        .modal-btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--card-border);
        }

        .modal-btn-secondary:hover {
            background: var(--card-border);
            color: var(--text-primary);
        }

        .success-color {
            color: #4caf50;
        }

        .error-color {
            color: #f44336;
        }
    </style>
</head>
<body>

    <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon" id="themeIcon">☀️</span>
    </div>

    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="form-container">
        <h1>Share Your Interview Experience</h1>
        <form id="interviewExperienceForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="companyName">Company Name</label>
                    <input type="text" id="companyName" name="company_name" required>
                </div>
                
                <div class="form-group">
                    <label for="jobRole">Job Role</label>
                    <input type="text" id="jobRole" name="job_role" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="jobLocation">Job Location</label>
                    <input type="text" id="jobLocation" name="job_location" required>
                </div>
                
                <div class="form-group">
                    <label for="packageOffered">Package Offered (LPA)</label>
                    <input type="number" id="packageOffered" name="package_offered" step="0.1" required>
                </div>
            </div>

            <div class="form-group">
                <label for="experienceSummary">Experience Summary</label>
                <textarea id="experienceSummary" name="experience_summary" placeholder="Brief summary of your overall interview experience" required></textarea>
            </div>

            <div class="form-group">
                <label for="rounds">Number of Rounds</label>
                <input type="number" id="rounds" name="rounds" min="1" max="10" value="1" required>
            </div>
            
            <div id="round-fields-container" style="display: none;">
                <label>Round Details</label>
                <div class="round-tab-container" id="round-tabs"></div>
                <div id="round-content"></div>
            </div>
            
            <button type="submit" class="submit-btn">Submit Experience</button>
        </form>
    </div>

    <!-- Modern Popup Modal -->
    <div id="modalOverlay" class="modal-overlay">
        <div class="modal">
            <span id="modalIcon" class="modal-icon">✓</span>
            <h3 id="modalTitle" class="modal-title">Success!</h3>
            <p id="modalMessage" class="modal-message">Your message here</p>
            <div class="modal-buttons">
                <button id="modalPrimaryBtn" class="modal-btn modal-btn-primary">OK</button>
                <button id="modalSecondaryBtn" class="modal-btn modal-btn-secondary" style="display: none;">Cancel</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const body = document.body;

            // Theme Toggle logic
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });
            
            // Dynamic Form Logic
            const roundsInput = document.getElementById('rounds');
            const roundFieldsContainer = document.getElementById('round-fields-container');
            const roundTabsContainer = document.getElementById('round-tabs');
            const roundContentContainer = document.getElementById('round-content');
            const form = document.getElementById('interviewExperienceForm');

            const roundTypes = ['Online Coding Test', 'Technical Interview', 'HR Interview', 'System Design', 'Aptitude Test', 'Group Discussion'];

            function generateRoundFields(numRounds) {
                if (numRounds > 0) {
                    roundFieldsContainer.style.display = 'block';
                    roundTabsContainer.innerHTML = '';
                    roundContentContainer.innerHTML = '';

                    for (let i = 1; i <= numRounds; i++) {
                        // Create tab
                        const tab = document.createElement('div');
                        tab.className = 'round-tab';
                        tab.textContent = `Round ${i}`;
                        tab.dataset.round = i;
                        roundTabsContainer.appendChild(tab);

                        // Create content section
                        const content = document.createElement('div');
                        content.className = 'round-tab-content';
                        content.dataset.round = i;
                        content.innerHTML = `
                            <div class="form-group round-info-container">
                                <div class="form-group">
                                    <label for="roundType-${i}">Round Type</label>
                                    <select id="roundType-${i}" name="roundType-${i}" required>
                                        <option value="">Select Round Type</option>
                                        ${roundTypes.map(type => `<option value="${type}">${type}</option>`).join('')}
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="roundDescription-${i}">Round Description</label>
                                    <textarea id="roundDescription-${i}" name="roundDescription-${i}" placeholder="Describe what happened in this round, questions asked, etc." required></textarea>
                                </div>
                                <div class="form-group">
                                    <label for="roundDate-${i}">Round Date</label>
                                    <input type="date" id="roundDate-${i}" name="roundDate-${i}" required>
                                </div>
                            </div>
                        `;
                        roundContentContainer.appendChild(content);
                    }

                    // Activate the first tab by default
                    if (document.querySelector('.round-tab')) {
                        document.querySelector('.round-tab').classList.add('active');
                        document.querySelector('.round-tab-content').classList.add('active');
                    }
                } else {
                    roundFieldsContainer.style.display = 'none';
                }
            }

            roundsInput.addEventListener('input', (e) => {
                const numRounds = parseInt(e.target.value);
                if (numRounds >= 1 && numRounds <= 10) {
                    generateRoundFields(numRounds);
                } else if (numRounds < 1) {
                    roundFieldsContainer.style.display = 'none';
                }
            });

            // Tab switching logic
            roundTabsContainer.addEventListener('click', (e) => {
                const clickedTab = e.target.closest('.round-tab');
                if (clickedTab) {
                    // Deactivate all tabs and content
                    document.querySelectorAll('.round-tab').forEach(tab => tab.classList.remove('active'));
                    document.querySelectorAll('.round-tab-content').forEach(content => content.classList.remove('active'));
                    
                    // Activate the clicked tab and corresponding content
                    clickedTab.classList.add('active');
                    document.querySelector(`.round-tab-content[data-round="${clickedTab.dataset.round}"]`).classList.add('active');
                }
            });

            // Initial call for one round
            generateRoundFields(1);

            // Modern Popup Functions
            function showModal(type, title, message, primaryBtnText = 'OK', showSecondary = false, onPrimary = null, onSecondary = null) {
                const overlay = document.getElementById('modalOverlay');
                const icon = document.getElementById('modalIcon');
                const titleEl = document.getElementById('modalTitle');
                const messageEl = document.getElementById('modalMessage');
                const primaryBtn = document.getElementById('modalPrimaryBtn');
                const secondaryBtn = document.getElementById('modalSecondaryBtn');

                // Set content based on type
                if (type === 'success') {
                    icon.textContent = '✓';
                    icon.className = 'modal-icon success';
                    titleEl.className = 'modal-title success-color';
                } else if (type === 'error') {
                    icon.textContent = '✕';
                    icon.className = 'modal-icon error';
                    titleEl.className = 'modal-title error-color';
                } else {
                    icon.textContent = 'ℹ';
                    icon.className = 'modal-icon';
                    titleEl.className = 'modal-title';
                }

                titleEl.textContent = title;
                messageEl.textContent = message;
                primaryBtn.textContent = primaryBtnText;

                // Handle secondary button
                if (showSecondary) {
                    secondaryBtn.style.display = 'inline-block';
                } else {
                    secondaryBtn.style.display = 'none';
                }

                // Set up event listeners
                primaryBtn.onclick = () => {
                    hideModal();
                    if (onPrimary) onPrimary();
                };

                secondaryBtn.onclick = () => {
                    hideModal();
                    if (onSecondary) onSecondary();
                };

                // Show modal
                overlay.classList.add('active');
                document.body.style.overflow = 'hidden';
            }

            function hideModal() {
                const overlay = document.getElementById('modalOverlay');
                overlay.classList.remove('active');
                document.body.style.overflow = '';
            }

            // Close modal when clicking outside
            document.getElementById('modalOverlay').addEventListener('click', (e) => {
                if (e.target === e.currentTarget) {
                    hideModal();
                }
            });

            // Close modal with Escape key
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    hideModal();
                }
            });

            // API Submission Logic
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = e.target.querySelector('.submit-btn');
                submitBtn.textContent = 'Submitting...';
                submitBtn.classList.add('loading');

                // Collect data for the API request body
                const formData = new FormData(form);
                const numRounds = parseInt(formData.get('rounds'));
                
                const data = {
                    company_name: formData.get('company_name'),
                    job_role: formData.get('job_role'),
                    job_location: formData.get('job_location'),
                    package_offered: parseFloat(formData.get('package_offered')),
                    experience_summary: formData.get('experience_summary'),
                    rounds: []
                };

                // Collect dynamic round data
                for (let i = 1; i <= numRounds; i++) {
                    const roundType = document.getElementById(`roundType-${i}`).value;
                    const roundDescription = document.getElementById(`roundDescription-${i}`).value;
                    const roundDate = document.getElementById(`roundDate-${i}`).value;
                    
                    if (roundType && roundDescription && roundDate) {
                        data.rounds.push({
                            round_number: i,
                            round_type: roundType,
                            round_description: roundDescription,
                            round_date: roundDate
                        });
                    }
                }
                
                try {
                    // Get JWT token from localStorage (you'll need to implement login first)
                    const token = localStorage.getItem('authToken');
                    
                    const response = await fetch('http://localhost:5000/api/interviews/add', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (response.ok) {
                        showModal('success', 'Success!', result.message || 'Interview experience added successfully!', 'Continue', false, () => {
                            form.reset();
                            generateRoundFields(1); // Reset the form to one round
                        });
                    } else {
                        showModal('error', 'Error', `Failed to add experience: ${result.message || 'Unknown error'}`, 'Try Again');
                    }
                } catch (error) {
                    console.error('Error:', error);
                    showModal('error', 'Connection Error', 'An error occurred while submitting. Please check your connection and try again.', 'Retry');
                } finally {
                    submitBtn.textContent = 'Submit Experience';
                    submitBtn.classList.remove('loading');
                }
            });
        });
    </script>
</body>
</html>
