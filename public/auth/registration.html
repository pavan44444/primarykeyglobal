<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --glass-bg: rgba(26, 26, 46, 0.3);
            --glass-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --input-bg: rgba(13, 71, 161, 0.15);
            --input-border: rgba(13, 71, 161, 0.3);
            --input-focus-bg: rgba(13, 71, 161, 0.25);
            --input-focus-border: rgba(13, 71, 161, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --success-bg: rgba(13, 71, 161, 0.2);
            --success-border: rgba(13, 71, 161, 0.4);
            --success-text: #64b5f6;
            --error-bg: rgba(211, 47, 47, 0.2);
            --error-border: rgba(211, 47, 47, 0.4);
            --error-text: #ef5350;
            --shape-bg: rgba(13, 71, 161, 0.1);
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(33, 150, 243, 0.3);
            --input-focus-bg: rgba(255, 255, 255, 0.8);
            --input-focus-border: rgba(33, 150, 243, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --success-bg: rgba(33, 150, 243, 0.15);
            --success-border: rgba(33, 150, 243, 0.3);
            --success-text: #1976d2;
            --error-bg: rgba(211, 47, 47, 0.15);
            --error-border: rgba(211, 47, 47, 0.3);
            --error-text: #d32f2f;
            --shape-bg: rgba(255, 255, 255, 0.2);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--primary-bg);
            background-size: 400% 400%;
            animation: gradientShift 8s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 20%;
            left: 10%;
            animation-delay: 0s;
        }

        .shape:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 60%;
            right: 15%;
            animation-delay: 2s;
        }

        .shape:nth-child(3) {
            width: 60px;
            height: 60px;
            bottom: 20%;
            left: 20%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .auth-container {
            position: relative;
            z-index: 10;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            width: 420px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
            transition: all 0.3s ease;
        }

        .auth-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 35px 70px rgba(0, 0, 0, 0.3);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        .auth-subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 400;
        }

        .form-container {
            position: relative;
        }

        .form {
            display: none;
            animation: slideIn 0.5s ease;
        }

        .form.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        .form-input:focus {
            background: var(--input-focus-bg);
            border-color: var(--input-focus-border);
            box-shadow: 0 0 20px var(--input-focus-border);
            transform: translateY(-2px);
        }

        .form-row {
            display: flex;
            gap: 15px;
        }

        .form-row .form-group {
            flex: 1;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .toggle-form {
            text-align: center;
            margin-top: 25px;
            padding-top: 25px;
            border-top: 1px solid var(--glass-border);
        }

        .toggle-link {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .toggle-link:hover {
            color: var(--text-primary);
            text-shadow: 0 0 10px var(--input-focus-border);
        }

        .loading {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
            display: none;
        }

        .message.success {
            background: var(--success-bg);
            border: 1px solid var(--success-border);
            color: var(--success-text);
        }

        .message.error {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
        }

        .role-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .role-option {
            flex: 1;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: var(--text-secondary);
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .role-option.active {
            background: var(--input-focus-bg);
            border-color: var(--input-focus-border);
            color: var(--text-primary);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .theme-icon {
            font-size: 20px;
            color: var(--text-primary);
        }

        @media (max-width: 480px) {
            .auth-container {
                width: 90%;
                padding: 30px 20px;
            }
            
            .form-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon" id="themeIcon">🌙</span>
    </div>

    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="auth-container">
        <div class="auth-header">
            <h1 class="auth-title" id="authTitle">Welcome Back</h1>
            <p class="auth-subtitle" id="authSubtitle">Sign in to your account</p>
        </div>

        <div class="message" id="message"></div>

        <div class="form-container">
            <!-- Login Form -->
            <form class="form active" id="loginForm">
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" id="loginEmail" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn" id="loginBtn">
                    <span class="btn-text">Sign In</span>
                    <div class="loading" id="loginLoading"></div>
                </button>
            </form>

            <!-- Registration Form -->
            <form class="form" id="registerForm">
                <div class="form-group">
                    <input type="text" class="form-input" placeholder="Full Name" id="registerName" required>
                </div>
                <div class="form-group">
                    <input type="email" class="form-input" placeholder="Email" id="registerEmail" required>
                </div>
                <div class="form-group">
                    <input type="password" class="form-input" placeholder="Password" id="registerPassword" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <input type="text" class="form-input" placeholder="College" id="registerCollege" required>
                    </div>
                    <div class="form-group">
                        <input type="text" class="form-input" placeholder="City" id="registerCity" required>
                    </div>
                </div>
                <div class="role-selector">
                    <div class="role-option active" data-role="user">User</div>
                    <div class="role-option" data-role="admin">Admin</div>
                </div>
                <button type="submit" class="btn" id="registerBtn">
                    <span class="btn-text">Create Account</span>
                    <div class="loading" id="registerLoading"></div>
                </button>
            </form>
        </div>

        <div class="toggle-form">
            <a href="#" class="toggle-link" id="toggleLink">Don't have an account? Sign up</a>
        </div>
    </div>

    <script>
       
        class AuthPage {
            constructor() {
                this.isLogin = true;
                this.selectedRole = 'user';
                this.theme = localStorage.getItem('theme') || 'dark';
                this.initializeTheme();
                this.initializeElements();
                this.bindEvents();
            }

            initializeTheme() {
                document.documentElement.setAttribute('data-theme', this.theme);
                const themeIcon = document.getElementById('themeIcon');
                if (themeIcon) {
                    themeIcon.textContent = this.theme === 'dark' ? '☀️' : '🌙';
                }
            }

            initializeElements() {
                this.loginForm = document.getElementById('loginForm');
                this.registerForm = document.getElementById('registerForm');
                this.toggleLink = document.getElementById('toggleLink');
                this.authTitle = document.getElementById('authTitle');
                this.authSubtitle = document.getElementById('authSubtitle');
                this.message = document.getElementById('message');
                this.roleOptions = document.querySelectorAll('.role-option');
                this.themeToggle = document.getElementById('themeToggle');
            }

            bindEvents() {
                this.toggleLink.addEventListener('click', (e) => {
                    e.preventDefault();
                    this.toggleForm();
                });

                this.themeToggle.addEventListener('click', () => {
                    this.toggleTheme();
                });

                this.loginForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleLogin();
                });

                this.registerForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleRegister();
                });

                this.roleOptions.forEach(option => {
                    option.addEventListener('click', () => {
                        this.selectRole(option.dataset.role);
                    });
                });

                // Add input animations
                document.querySelectorAll('.form-input').forEach(input => {
                    input.addEventListener('focus', this.handleInputFocus);
                    input.addEventListener('blur', this.handleInputBlur);
                });
            }

            toggleTheme() {
                this.theme = this.theme === 'dark' ? 'light' : 'dark';
                document.documentElement.setAttribute('data-theme', this.theme);
                localStorage.setItem('theme', this.theme);
                
                const themeIcon = document.getElementById('themeIcon');
                themeIcon.textContent = this.theme === 'dark' ? '☀️' : '🌙';
            }

            toggleForm() {
                this.isLogin = !this.isLogin;
                
                if (this.isLogin) {
                    this.loginForm.classList.add('active');
                    this.registerForm.classList.remove('active');
                    this.authTitle.textContent = 'Welcome Back';
                    this.authSubtitle.textContent = 'Sign in to your account';
                    this.toggleLink.textContent = "Don't have an account? Sign up";
                } else {
                    this.registerForm.classList.add('active');
                    this.loginForm.classList.remove('active');
                    this.authTitle.textContent = 'Create Account';
                    this.authSubtitle.textContent = 'Join us today';
                    this.toggleLink.textContent = 'Already have an account? Sign in';
                }

                this.hideMessage();
            }

            selectRole(role) {
                this.selectedRole = role;
                this.roleOptions.forEach(option => {
                    option.classList.toggle('active', option.dataset.role === role);
                });
            }

            handleInputFocus(e) {
                e.target.style.transform = 'scale(1.02)';
            }

            handleInputBlur(e) {
                e.target.style.transform = 'scale(1)';
            }

            async handleLogin() {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;

                if (!email || !password) {
                    this.showMessage('Please fill in all fields', 'error');
                    return;
                }

                this.setLoading(true, 'login');

                try {
                    const response = await fetch('http://localhost:5000/api/auth/login', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (response.ok) {
    // Store the token in localStorage
    localStorage.setItem('authToken', data.token);
    
    window.location.href = "../dashboard/dashboard.html";
    console.log('Login successful:', data);
} else {
                        this.showMessage(data.message || 'Login failed', 'error');
                    }
                } catch (error) {
                    this.showMessage('Network error. Please try again.', 'error');
                    console.error('Login error:', error);
                } finally {
                    this.setLoading(false, 'login');
                }
            }

            async handleRegister() {
                const name = document.getElementById('registerName').value;
                const email = document.getElementById('registerEmail').value;
                const password = document.getElementById('registerPassword').value;
                const college = document.getElementById('registerCollege').value;
                const city = document.getElementById('registerCity').value;

                if (!name || !email || !password || !college || !city) {
                    this.showMessage('Please fill in all fields', 'error');
                    return;
                }

                if (password.length < 6) {
                    this.showMessage('Password must be at least 6 characters', 'error');
                    return;
                }

                this.setLoading(true, 'register');

                try {
                    const response = await fetch('http://localhost:5000/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            name,
                            email,
                            password,
                            college,
                            city,
                            role: this.selectedRole
                        })
                    });

                    const data = await response.json();

                    if (response.ok) {
                        this.showMessage('Account created successfully! You can now sign in.', 'success');
                        setTimeout(() => {
                            this.toggleForm();
                            document.getElementById('loginEmail').value = email;
                        }, 2000);
                    } else {
                        this.showMessage(data.message || 'Registration failed', 'error');
                    }
                } catch (error) {
                    this.showMessage('Network error. Please try again.', 'error');
                    console.error('Registration error:', error);
                } finally {
                    this.setLoading(false, 'register');
                }
            }

            setLoading(loading, form) {
                const btn = document.getElementById(`${form}Btn`);
                const btnText = btn.querySelector('.btn-text');
                const loadingSpinner = document.getElementById(`${form}Loading`);

                if (loading) {
                    btn.disabled = true;
                    btnText.style.display = 'none';
                    loadingSpinner.style.display = 'block';
                } else {
                    btn.disabled = false;
                    btnText.style.display = 'inline';
                    loadingSpinner.style.display = 'none';
                }
            }

            showMessage(text, type) {
                this.message.textContent = text;
                this.message.className = `message ${type}`;
                this.message.style.display = 'block';

                if (type === 'success') {
                    setTimeout(() => {
                        this.hideMessage();
                    }, 3000);
                }
            }

            hideMessage() {
                this.message.style.display = 'none';
            }
        }

        // Initialize the auth page
        new AuthPage();
    </script>
</body>
</html>
