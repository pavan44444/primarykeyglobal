<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <script>
    (function () {
        const savedTheme = localStorage.getItem("theme") || "dark";
        document.documentElement.setAttribute("data-theme", savedTheme);
    })();
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Companies Visited - PRIMARY KEY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/theme.css">
  <link rel="stylesheet" href="../assets/sidebar.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 1400px;
      margin: 0 auto;
      padding: 40px 32px 80px;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 24px;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      color: var(--text-primary);
      text-decoration: none;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      transition: all 0.3s ease;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .back-button:hover {
      border-color: #0284c7;
      transform: translateX(-5px);
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
    }

    .header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeInUp 0.8s ease;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 24px;
      border-radius: 30px;
      background: rgba(2, 132, 199, 0.2);
      border: 1px solid rgba(2, 132, 199, 0.4);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
    }

    .page-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(40px, 7vw, 64px);
      font-weight: 900;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9, #06b6d4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
    }

    .page-subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.6;
    }

    /* Search Bar */
    .search-container {
      margin-bottom: 48px;
      animation: fadeInUp 0.8s ease 0.2s backwards;
    }

    .search-wrapper {
      max-width: 600px;
      margin: 0 auto;
      position: relative;
    }

    .search-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: var(--text-muted);
      pointer-events: none;
    }

    .search-input {
      width: 100%;
      padding: 18px 20px 18px 56px;
      border-radius: 16px;
      border: 2px solid var(--input-border);
      background: var(--input-bg);
      backdrop-filter: blur(20px);
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      transition: all 0.3s ease;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--input-focus-border);
      background: var(--input-focus-bg);
      box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.15);
    }

    .search-input::placeholder {
      color: var(--text-muted);
    }

    .results-count {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 600;
    }

    /* Companies Grid */
    .companies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 28px;
      animation: fadeInUp 0.8s ease 0.4s backwards;
    }

    .company-card {
      padding: 32px 28px;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      cursor: pointer;
      animation: slideUp 0.6s ease backwards;
    }

    .company-card:nth-child(1) { animation-delay: 0.5s; }
    .company-card:nth-child(2) { animation-delay: 0.6s; }
    .company-card:nth-child(3) { animation-delay: 0.7s; }
    .company-card:nth-child(4) { animation-delay: 0.8s; }
    .company-card:nth-child(5) { animation-delay: 0.9s; }
    .company-card:nth-child(6) { animation-delay: 1s; }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .company-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.05), rgba(6, 182, 212, 0.05));
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .company-card:hover::before {
      opacity: 1;
    }

    .company-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #0284c7, #0ea5e9, #06b6d4);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 0.5s ease;
    }

    .company-card:hover::after {
      transform: scaleX(1);
    }

    .company-card:hover {
      transform: translateY(-12px);
      box-shadow: 0 24px 64px rgba(2, 132, 199, 0.3);
    }

    .company-logo-wrapper {
      width: 80px;
      height: 80px;
      background: var(--btn-gradient);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(2, 132, 199, 0.4);
      transition: all 0.4s ease;
      overflow: hidden;
    }

    .company-card:hover .company-logo-wrapper {
      transform: scale(1.1) rotate(-5deg);
    }

    .company-logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      padding: 12px;
      background: white;
      border-radius: 18px;
    }

    .company-logo-fallback {
      font-size: 40px;
      color: white;
    }

    .company-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 900;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #0284c7, #0ea5e9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
      line-height: 1.2;
      text-transform: capitalize;
    }

    /* Loading & Error States */
    .loading, .error, .no-results {
      text-align: center;
      padding: 80px 40px;
      border-radius: 24px;
      animation: fadeInUp 0.8s ease;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 4px solid var(--glass-border);
      border-top: 4px solid #0284c7;
      border-radius: 50%;
      display: inline-block;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      background: var(--error-bg);
      border: 2px solid var(--error-border);
    }

    .error h3 {
      color: var(--error-text);
      font-size: 28px;
      margin-bottom: 16px;
      font-family: 'Space Grotesk', sans-serif;
    }

    .no-results {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
    }

    .no-results-icon {
      font-size: 80px;
      margin-bottom: 24px;
      opacity: 0.5;
    }

    .no-results h3 {
      font-size: 28px;
      margin-bottom: 16px;
      color: var(--text-primary);
      font-family: 'Space Grotesk', sans-serif;
    }

    .no-results p {
      color: var(--text-secondary);
      font-size: 16px;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container {
        padding: 20px 20px 60px;
      }

      .companies-grid {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 40px;
        letter-spacing: -1px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <a href="../dashboard/dashboard.html" class="back-button">
      ← Back to Dashboard
    </a>

    <div class="header">
      <div class="header-badge">
        <span>🏢</span>
        <span>Campus Recruiting</span>
      </div>
      <h1 class="page-title">Companies Visited</h1>
      <p class="page-subtitle">Explore companies that have visited your campus for recruitment drives</p>
    </div>

    <!-- Search Bar -->
    <div class="search-container">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input 
          type="text" 
          id="searchInput" 
          class="search-input" 
          placeholder="Search company by name"
          autocomplete="off"
        >
      </div>
      <div class="results-count" id="resultsCount"></div>
    </div>

    <!-- Companies Container -->
    <div id="companiesContainer">
      <div class="loading glass">
        <div class="loading-spinner"></div>
        <p style="color: var(--text-secondary); font-size: 18px; font-weight: 600;">Loading companies...</p>
      </div>
    </div>
  </div>

  <script>
    const API_BASE_URL = "http://localhost:5000/";
   // const API_BASE_URL = "https://primarykey-production-6114.up.railway.app/";
    const token = localStorage.getItem('authToken');
    
    let allCompanies = [];
    let filteredCompanies = [];

    const companiesContainer = document.getElementById('companiesContainer');
    const searchInput = document.getElementById('searchInput');
    const resultsCount = document.getElementById('resultsCount');

    function getLogoUrl(websiteUrl) {
      if (!websiteUrl) return '';
      let domain = websiteUrl.toLowerCase();
      domain = domain.replace(/^https?:\/\//, '');
      domain = domain.replace(/^www\./, '');
      domain = domain.split('/')[0];
      return `https://logo.clearbit.com/${domain}`;
    }

    function showError(message) {
      companiesContainer.innerHTML = `
        <div class="error glass">
          <h3>⚠️ Error</h3>
          <p style="color: var(--text-secondary); font-size: 16px;">${message}</p>
        </div>
      `;
    }

    function showNoResults(searchTerm = '') {
      const message = searchTerm 
        ? `No companies found matching "${searchTerm}"`
        : 'No companies have visited your campus yet';
      
      companiesContainer.innerHTML = `
        <div class="no-results glass">
          <div class="no-results-icon">🏢</div>
          <h3>${message}</h3>
          <p>${searchTerm ? 'Try a different search term' : 'Check back later for recruitment updates'}</p>
        </div>
      `;
    }

    function updateResultsCount() {
      if (filteredCompanies.length === 0) {
        resultsCount.textContent = '';
      } else {
        resultsCount.textContent = `Showing ${filteredCompanies.length} compan${filteredCompanies.length !== 1 ? 'ies' : 'y'}`;
      }
    }

    function renderCompanies(companies) {
      if (companies.length === 0) {
        showNoResults(searchInput.value.trim());
        updateResultsCount();
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'companies-grid';

      companies.forEach((company, index) => {
        const card = document.createElement('div');
        card.className = 'company-card glass';

        const logoUrl = getLogoUrl(company.website_url);

        card.innerHTML = `
          <div class="company-logo-wrapper">
            ${logoUrl ? 
              `<img src="${logoUrl}" alt="${company.company_name}" class="company-logo" onerror="this.parentElement.innerHTML='<span class=company-logo-fallback>🏢</span>'">` :
              `<span class="company-logo-fallback">🏢</span>`
            }
          </div>
          <h2 class="company-name">${company.company_name}</h2>
        `;

        grid.appendChild(card);
      });

      companiesContainer.innerHTML = '';
      companiesContainer.appendChild(grid);
      updateResultsCount();
    }

    function filterCompanies(searchTerm) {
      if (!searchTerm.trim()) {
        filteredCompanies = [...allCompanies];
      } else {
        const term = searchTerm.toLowerCase();
        filteredCompanies = allCompanies.filter(company => 
          company.company_name.toLowerCase().includes(term)
        );
      }
      renderCompanies(filteredCompanies);
    }

    // Search functionality
    searchInput.addEventListener('input', (e) => {
      filterCompanies(e.target.value);
    });

    async function fetchCompanies() {
      try {
        const response = await fetch(`${API_BASE_URL}api/companies/college`, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json',
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error('Please login to view companies');
          }
          const errData = await response.json();
          throw new Error(errData.message || 'Failed to fetch companies');
        }

        const companies = await response.json();
        
        allCompanies = companies.filter(company => company.is_active === 1);
        
        if (allCompanies.length === 0) {
          showNoResults();
          return;
        }

        filteredCompanies = [...allCompanies];
        renderCompanies(filteredCompanies);

      } catch (err) {
        console.error('Error fetching companies:', err);
        showError(err.message);
      }
    }

    // Initialize
    if (!token) {
      showError('Please login to view companies');
    } else {
      fetchCompanies();
    }
  </script>
  <script src="../assets/sidebar.js"></script>
</body>
</html>
