<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Companies Visited</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f23, #0d47a1);
      color: #fff;
    }

    header {
      padding: 20px;
      text-align: center;
      background-color: rgba(0, 0, 0, 0.3);
      font-size: 2em;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .company-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
      padding: 40px;
    }

    .company-card {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
    }

    .company-card:hover {
      transform: scale(1.05);
      background-color: rgba(255, 255, 255, 0.1);
    }

    .company-logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      margin-bottom: 15px;
    }

    .company-name {
      font-size: 1.2em;
      font-weight: 600;
      margin-bottom: 10px;
      text-transform: capitalize;
    }

    .job-role, .package {
      font-size: 0.95em;
      margin-bottom: 6px;
      opacity: 0.9;
    }
  </style>
</head>
<body>

  <header>🏢 Companies Visited</header>

  <section class="company-container" id="companyContainer">
    <!-- Dynamic company cards will be injected here -->
  </section>

<script>
  // Get JWT token from localStorage
  const jwtToken = localStorage.getItem('authToken');

  async function fetchCompanies() {
    try {
      const response = await fetch('${API_URL}/companies/college', {
        headers: {
          'Authorization': 'Bearer ' + jwtToken,
          'Content-Type': 'application/json',
        }
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(errData.message || 'Failed to fetch companies');
      }

      const companies = await response.json();
      return companies;
    } catch (err) {
      alert('Error fetching companies: ' + err.message);
      return [];
    }
  }

  function formatPackage(packageStr) {
    const amount = parseFloat(packageStr);
    if (isNaN(amount)) return packageStr;

    return `₹${(amount / 100000).toFixed(2)} LPA`;
  }

  function getLogoUrl(websiteUrl) {
    if (!websiteUrl) return '';

    let domain = websiteUrl.toLowerCase();
    domain = domain.replace(/^https?:\/\//, '');
    domain = domain.replace(/^www\./, '');
    domain = domain.split('/')[0];

    return `https://logo.clearbit.com/${domain}`;
  }

  function createCompanyCard(company) {
    const card = document.createElement('div');
    card.className = 'company-card';

    const logoUrl = getLogoUrl(company.website_url);

    card.innerHTML = `
      <img src="${logoUrl}" alt="${company.company_name}" class="company-logo" onerror="this.style.display='none'"/>
      <div class="company-name">${company.company_name}</div>
      <div class="job-role">${company.job_role}</div>
      <div class="package">Package: ${formatPackage(company.package_offered)}</div>
    `;

    return card;
  }

  async function displayCompanies() {
    const container = document.getElementById('companyContainer');
    container.innerHTML = ''; // clear existing content

    if (!jwtToken) {
      container.innerHTML = '<p>Please log in to see company visits.</p>';
      return;
    }

    const companies = await fetchCompanies();

    if (companies.length === 0) {
      container.innerHTML = '<p>No companies found for your college.</p>';
      return;
    }

    companies.forEach(company => {
      if(company.is_active === 1) {
        const card = createCompanyCard(company);
        container.appendChild(card);
      }
    });
  }

  displayCompanies();
</script>


</body>
</html>
