<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interview Experience Detail</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 10px;
      background: #f9fafb;
      color: #2c3e50;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
    }
    .rounds {
      margin-top: 20px;
      padding-left: 15px;
      border-left: 3px solid #3498db;
    }
    .round {
      margin-bottom: 15px;
    }
    .round strong {
      color: #2980b9;
      display: block;
      margin-bottom: 5px;
    }
    .back-link {
      display: inline-block;
      margin-bottom: 20px;
      text-decoration: none;
      color: #2980b9;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <a href="experience-detail.html" class="back-link">&larr; Back to Interview Experiences</a>
  <h1>Interview Experience Detail</h1>
  <div id="experienceDetail"></div>
  <div id="errorMessage" style="color: red;"></div>

  <script>
    const experienceDetail = document.getElementById('experienceDetail');
    const errorMessage = document.getElementById('errorMessage');
    const API_URL = 'http://localhost:5000/api/interviews'; // Assuming this endpoint exists for single fetch

    // Get the id param from URL
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');

    async function loadExperienceDetail() {
      if (!id) {
        errorMessage.textContent = 'No interview ID provided.';
        return;
      }

      const token = localStorage.getItem('authToken');
      if (!token) {
        errorMessage.textContent = 'Authentication token not found. Please login first.';
        return;
      }

      try {
        const response = await fetch(`${API_URL}/${id}`, {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error('Unauthorized: Invalid or expired token.');
          } else if (response.status === 404) {
            throw new Error('Interview experience not found.');
          } else {
            throw new Error('Failed to fetch data. Status: ' + response.status);
          }
        }

        const exp = await response.json();

        experienceDetail.innerHTML = `
          <p><strong>Student:</strong> ${exp.student_name}</p>
          <p><strong>Company:</strong> ${exp.company_name}</p>
          <p><strong>Date Submitted:</strong> ${new Date(exp.created_at).toLocaleDateString()}</p>
          <p><strong>Package:</strong> ₹${parseFloat(exp.package_offered).toLocaleString()}</p>
          <p><strong>Job Role:</strong> ${exp.job_role}</p>
          <p><strong>Location:</strong> ${exp.job_location}</p>
          <p><strong>Experience Summary:</strong><br/>${exp.experience_summary}</p>

          <div class="rounds">
            <h3>Interview Rounds</h3>
            ${exp.rounds && exp.rounds.length > 0 ? exp.rounds.map(round => `
              <div class="round">
                <strong>Round ${round.round_number}: ${round.round_type}</strong>
                <p>${round.round_description}</p>
                <p><em>Date: ${new Date(round.round_date).toLocaleDateString()}</em></p>
              </div>
            `).join('') : '<p>No interview rounds details available.</p>'}
          </div>
        `;

      } catch (err) {
        errorMessage.textContent = err.message;
      }
    }

    window.onload = loadExperienceDetail;
  </script>

</body>
</html>
