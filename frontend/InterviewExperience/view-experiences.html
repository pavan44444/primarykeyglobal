<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Experiences</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --card-bg: rgba(26, 26, 46, 0.3);
            --card-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.3);
            --shape-bg: rgba(13, 71, 161, 0.1);
            --experience-card-bg: rgba(255, 255, 255, 0.05);
            --experience-card-border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.2);
            --shape-bg: rgba(255, 255, 255, 0.2);
            --experience-card-bg: rgba(0, 0, 0, 0.05);
            --experience-card-border: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .theme-icon { font-size: 20px; color: var(--text-primary); }

        .experiences-container {
            width: 100%;
            max-width: 1000px;
            margin: 60px auto 20px;
            z-index: 1;
        }
        
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .page-title {
            font-size: 36px;
            font-weight: 700;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
        }

        .add-experience-btn {
            padding: 12px 25px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .add-experience-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px var(--btn-hover-shadow);
        }

        #experiences-list {
            display: grid;
            gap: 20px;
        }

        .experience-card {
            background: var(--experience-card-bg);
            border: 1px solid var(--experience-card-border);
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .experience-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .company-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .meta-info {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .rounds-section h3 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .round-item {
            background-color: rgba(255, 255, 255, 0.03);
            border-left: 3px solid var(--btn-gradient);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .round-item h4 {
            margin: 0 0 5px;
            font-size: 16px;
            font-weight: 500;
        }

        .round-item p {
            margin: 0;
            font-size: 14px;
            color: var(--text-secondary);
        }

        .loading, .error {
            text-align: center;
            font-size: 20px;
            padding: 50px;
            color: var(--text-secondary);
        }

    </style>
</head>
<body>

    <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon" id="themeIcon">☀️</span>
    </div>

    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="experiences-container">
        <div class="header-section">
            <h1 class="page-title">Interview Experiences</h1>
            <a href="add-experience.html" class="add-experience-btn">Add Experience</a>
        </div>
        
        <div id="experiences-list">
            <div class="loading">Loading experiences...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const experiencesList = document.getElementById('experiences-list');

            // Theme Toggle logic
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });

            // Function to fetch and display experiences
            async function fetchExperiences() {
                try {
                   const token = localStorage.getItem('authToken') || sessionStorage.getItem('authToken'); // or however you store the token
                   console.log(localStorage);
if (!token) {
    experiencesList.innerHTML = '<div class="error">Please login to view experiences.</div>';
    return;
}

const response = await fetch('http://localhost:3000/api/experiences/my-college', {
    method: 'GET',
    headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
    }
}); 
                   if (!response.ok) {
    if (response.status === 401) {
        localStorage.removeItem('authToken'); // Clear invalid token
        experiencesList.innerHTML = '<div class="error">Session expired. Please login again.</div>';
        return;
    }
    throw new Error('Network response was not ok');
}
                    const experiences = await response.json();
                    
                    if (experiences.length === 0) {
                        experiencesList.innerHTML = '<div class="loading">No experiences have been added yet.</div>';
                        return;
                    }

                    experiencesList.innerHTML = ''; // Clear loading message

                    experiences.forEach(exp => {
                        const experienceCard = document.createElement('div');
                        experienceCard.className = 'experience-card';

                        let roundsHtml = '';
                        if (exp.roundDetails && exp.roundDetails.length > 0) {
                            roundsHtml = `
                                <div class="rounds-section">
                                    <h3>Interview Rounds:</h3>
                                    ${exp.roundDetails.map(round => `
                                        <div class="round-item">
                                            <h4>Round ${round.roundNumber}: ${round.roundType}</h4>
                                            <p>${round.description}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                        }
                        
                       experienceCard.innerHTML = `
    <h2 class="company-title">${exp.company}</h2>
    <p class="meta-info">Passout Year: ${exp.passoutYear} | Rounds: ${exp.rounds}</p>
    <p class="description">${exp.description}</p>
    ${roundsHtml}
`;

// Make the card clickable
experienceCard.style.cursor = 'pointer';
experienceCard.addEventListener('click', () => {
    window.location.href = `experience-detail.html?id=${exp._id}`;
});

experiencesList.appendChild(experienceCard);
                    });

                } catch (error) {
                    console.error('Error fetching experiences:', error);
                    experiencesList.innerHTML = `<div class="error">Failed to load experiences. Please try again later.</div>`;
                }
            }

            // Call the function to fetch data when the page loads
            fetchExperiences();
        });
    </script>
</body>
</html>
