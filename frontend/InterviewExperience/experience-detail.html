<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Experience Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables for Theming */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --card-bg: rgba(26, 26, 46, 0.3);
            --card-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.3);
            --shape-bg: rgba(13, 71, 161, 0.1);
            --experience-card-bg: rgba(255, 255, 255, 0.05);
            --experience-card-border: rgba(255, 255, 255, 0.1);
            --success-color: #4caf50;
            --warning-color: #ff9800;
            --danger-color: #f44336;
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.2);
            --shape-bg: rgba(255, 255, 255, 0.2);
            --experience-card-bg: rgba(0, 0, 0, 0.05);
            --experience-card-border: rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 6s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; top: 20%; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; top: 60%; right: 15%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .theme-icon { font-size: 20px; color: var(--text-primary); }

        .detail-container {
            width: 100%;
            max-width: 900px;
            margin: 60px auto 20px;
            z-index: 1;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .back-btn:hover {
            transform: translateX(-5px);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .experience-header {
            background: var(--experience-card-bg);
            border: 1px solid var(--experience-card-border);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        .company-name {
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 10px;
            background: var(--btn-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .experience-meta {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .meta-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .meta-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .meta-value {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .description-section {
            background: var(--experience-card-bg);
            border: 1px solid var(--experience-card-border);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-icon {
            font-size: 24px;
        }

        .description-text {
            font-size: 16px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .rounds-section {
            background: var(--experience-card-bg);
            border: 1px solid var(--experience-card-border);
            border-radius: 15px;
            padding: 30px;
        }

        .rounds-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .round-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 25px;
            position: relative;
            transition: all 0.3s ease;
        }

        .round-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .round-number {
            position: absolute;
            top: -10px;
            left: 20px;
            background: var(--btn-gradient);
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
        }

        .round-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            margin-top: 10px;
        }

        .round-type {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .round-description {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-secondary);
        }

        .loading, .error {
            text-align: center;
            font-size: 20px;
            padding: 50px;
            color: var(--text-secondary);
            background: var(--experience-card-bg);
            border: 1px solid var(--experience-card-border);
            border-radius: 15px;
        }

        @media (max-width: 768px) {
            .experience-meta {
                gap: 20px;
            }
            
            .company-name {
                font-size: 32px;
            }
            
            .detail-container {
                margin: 40px auto 20px;
            }
        }
    </style>
</head>
<body>
    <div class="theme-toggle" id="themeToggle">
        <span class="theme-icon" id="themeIcon">☀️</span>
    </div>

    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="detail-container">
        <a href="interview-experiences.html" class="back-btn">
            ← Back to Experiences
        </a>
        
        <div id="experience-detail">
            <div class="loading">Loading experience details...</div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const experienceDetail = document.getElementById('experience-detail');

            // Theme Toggle logic
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });

            // Get experience ID from URL parameters
            const urlParams = new URLSearchParams(window.location.search);
            const experienceId = urlParams.get('id');

            if (!experienceId) {
                experienceDetail.innerHTML = '<div class="error">No experience ID provided.</div>';
                return;
            }

            // Function to fetch and display single experience
            async function fetchExperienceDetail() {
                try {
                    const token = localStorage.getItem('authToken');
                    if (!token) {
                        experienceDetail.innerHTML = '<div class="error">Please login to view experience details.</div>';
                        return;
                    }

                    const response = await fetch(`http://localhost:3000/api/experiences/${experienceId}`, {
                        method: 'GET',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        }
                    });

                    if (!response.ok) {
                        if (response.status === 401) {
                            localStorage.removeItem('authToken');
                            experienceDetail.innerHTML = '<div class="error">Session expired. Please login again.</div>';
                            return;
                        }
                        throw new Error('Failed to fetch experience details');
                    }

                    const experience = await response.json();
                    renderExperienceDetail(experience);

                } catch (error) {
                    console.error('Error fetching experience details:', error);
                    experienceDetail.innerHTML = '<div class="error">Failed to load experience details. Please try again later.</div>';
                }
            }

            function renderExperienceDetail(exp) {
                let roundsHtml = '';
                if (exp.roundDetails && exp.roundDetails.length > 0) {
                    roundsHtml = `
                        <div class="rounds-section">
                            <h2 class="section-title">
                                <span class="section-icon">🎯</span>
                                Interview Rounds
                            </h2>
                            <div class="rounds-grid">
                                ${exp.roundDetails.map(round => `
                                    <div class="round-card">
                                        <div class="round-number">${round.roundNumber}</div>
                                        <div class="round-header">
                                            <div class="round-type">${round.roundType}</div>
                                        </div>
                                        <div class="round-description">${round.description}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }

                experienceDetail.innerHTML = `
                    <div class="experience-header">
                        <h1 class="company-name">${exp.company}</h1>
                        <div class="experience-meta">
                            <div class="meta-item">
                                <div class="meta-label">Passout Year</div>
                                <div class="meta-value">${exp.passoutYear}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">Total Rounds</div>
                                <div class="meta-value">${exp.rounds}</div>
                            </div>
                            <div class="meta-item">
                                <div class="meta-label">College</div>
                                <div class="meta-value">${exp.collegeName || 'N/A'}</div>
                            </div>
                        </div>
                    </div>

                    <div class="description-section">
                        <h2 class="section-title">
                            <span class="section-icon">📝</span>
                            Experience Overview
                        </h2>
                        <div class="description-text">${exp.description}</div>
                    </div>

                    ${roundsHtml}
                `;
            }

            // Call the function to fetch data when the page loads
            fetchExperienceDetail();
        });
    </script>
</body>
</html>
