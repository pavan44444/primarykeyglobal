<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Subtopics</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /*
         * CSS Variables for Theming - Matching Dashboard Design
         */
        :root {
            --primary-bg: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 25%, #16213e 50%, #0f3460 75%, #0d47a1 100%);
            --secondary-bg: rgba(13, 71, 161, 0.1);
            --card-bg: rgba(26, 26, 46, 0.3);
            --card-border: rgba(13, 71, 161, 0.3);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.6);
            --btn-gradient: linear-gradient(135deg, #0d47a1, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.3);
            --shape-bg: rgba(13, 71, 161, 0.1);
            --accent-color: #64b5f6;
        }

        [data-theme="light"] {
            --primary-bg: linear-gradient(135deg, #e3f2fd 0%, #bbdefb 25%, #90caf9 50%, #64b5f6 75%, #2196f3 100%);
            --secondary-bg: rgba(33, 150, 243, 0.1);
            --card-bg: rgba(255, 255, 255, 0.4);
            --card-border: rgba(33, 150, 243, 0.3);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.8);
            --text-muted: rgba(26, 26, 46, 0.6);
            --btn-gradient: linear-gradient(135deg, #2196f3, #1976d2);
            --btn-hover-shadow: rgba(0, 0, 0, 0.2);
            --shape-bg: rgba(255, 255, 255, 0.2);
            --accent-color: #1976d2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--primary-bg);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
            transition: background-color 0.3s ease;
        }

        /*
         * Floating background shapes
         */
        .floating-shapes {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            overflow: hidden;
            z-index: -1;
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            background: var(--shape-bg);
            backdrop-filter: blur(10px);
            animation: float 10s ease-in-out infinite;
        }

        .shape:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 8%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 180px; height: 180px; top: 65%; right: 5%; animation-delay: 4s; }
        .shape:nth-child(3) { width: 90px; height: 90px; bottom: 10%; left: 12%; animation-delay: 8s; }
        .shape:nth-child(4) { width: 140px; height: 140px; top: 35%; right: 25%; animation-delay: 2s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); opacity: 0.6; }
            50% { transform: translateY(-40px) rotate(180deg); opacity: 1; }
        }

        /*
         * Navigation Bar
         */
        .nav-bar {
            position: fixed;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .back-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 15px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
            color: var(--accent-color);
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50%;
            width: 50px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 5px 15px var(--btn-hover-shadow);
        }

        .theme-icon { font-size: 20px; color: var(--text-primary); }

        /*
         * Main Container
         */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 100px 20px 40px;
        }

        /*
         * Header Section
         */
        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .breadcrumb {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-bottom: 30px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .breadcrumb-separator {
            color: var(--accent-color);
        }

        .topic-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 10px 20px;
            font-size: 16px;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }

        .page-title {
            font-size: 56px;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            background: linear-gradient(135deg, var(--text-primary), var(--accent-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .page-subtitle {
            font-size: 22px;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /*
         * Subtopics Grid
         */
        .subtopics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .subtopic-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-align: center;
        }

        .subtopic-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--btn-gradient);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .subtopic-card:hover {
            transform: translateY(-12px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .subtopic-card:hover::before {
            transform: scaleX(1);
        }

        .subtopic-icon {
            font-size: 70px;
            margin-bottom: 25px;
            display: block;
            filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.3));
        }

        .subtopic-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 15px;
        }

        .subtopic-description {
            font-size: 16px;
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .subtopic-btn {
            width: 100%;
            padding: 15px;
            background: var(--btn-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .subtopic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px var(--btn-hover-shadow);
        }

        /*
         * Responsive Design
         */
        @media (max-width: 768px) {
            .container {
                padding: 80px 10px 20px;
            }

            .page-title {
                font-size: 40px;
            }

            .page-subtitle {
                font-size: 18px;
            }

            .subtopics-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .subtopic-card {
                padding: 25px;
            }

            .nav-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }
        }

        /*
         * Loading Animation
         */
        .subtopic-card {
            animation: slideUp 0.6s ease forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        .subtopic-card:nth-child(1) { animation-delay: 0.1s; }
        .subtopic-card:nth-child(2) { animation-delay: 0.2s; }
        .subtopic-card:nth-child(3) { animation-delay: 0.3s; }
        .subtopic-card:nth-child(4) { animation-delay: 0.4s; }
        .subtopic-card:nth-child(5) { animation-delay: 0.5s; }
        .subtopic-card:nth-child(6) { animation-delay: 0.6s; }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /*
         * Empty State
         */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-icon {
            font-size: 80px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-secondary);
        }

        .empty-description {
            font-size: 16px;
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <div class="nav-bar">
        <a href="#" class="back-btn" onclick="goBack()">
            <span>←</span>
            <span>Back to Topics</span>
        </a>
        <div class="theme-toggle" id="themeToggle">
            <span class="theme-icon" id="themeIcon">☀️</span>
        </div>
    </div>

    <!-- Floating Background Shapes -->
    <div class="floating-shapes">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="breadcrumb">
                <span>Quiz Topics</span>
                <span class="breadcrumb-separator">›</span>
                <span id="currentTopicName">Programming Languages</span>
            </div>
            
            <div class="topic-badge">
                <span id="topicIcon">💻</span>
                <span id="topicBadgeText">Programming Languages</span>
            </div>
            
            <h1 class="page-title" id="pageTitle">Choose Your Language</h1>
            <p class="page-subtitle" id="pageSubtitle">Select a programming language to start your quiz</p>
        </div>

        <!-- Subtopics Grid -->
        <div class="subtopics-grid" id="subtopicsContainer">
            <!-- Subtopics will be dynamically loaded here -->
        </div>

        <!-- Empty State (hidden by default) -->
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📚</div>
            <h2 class="empty-title">No Quizzes Available</h2>
            <p class="empty-description">This topic doesn't have any quizzes available yet. Please check back later or try another topic.</p>
        </div>
    </div>

    <script>
        // Topic data structure - simplified for quizzes only
        const topicsData = {
            'programming': {
                icon: '💻',
                name: 'Programming Languages',
                title: 'Choose Your Language',
                subtitle: 'Select a programming language to start your quiz',
                subtopics: [
                    {
                        id: 'javascript',
                        title: 'JavaScript',
                        icon: '🟨',
                        description: 'Test your knowledge of JavaScript fundamentals, ES6+ features, and modern development practices.'
                    },
                    {
                        id: 'python',
                        title: 'Python',
                        icon: '🐍',
                        description: 'Challenge yourself with Python syntax, data structures, and object-oriented programming concepts.'
                    },
                    {
                        id: 'java',
                        title: 'Java',
                        icon: '☕',
                        description: 'Evaluate your understanding of Java core concepts, OOP principles, and platform features.'
                    },
                    {
                        id: 'cpp',
                        title: 'C++',
                        icon: '⚡',
                        description: 'Test your C++ skills including pointers, memory management, and object-oriented programming.'
                    },
                    {
                        id: 'c',
                        title: 'C',
                        icon: '🔧',
                        description: 'Master C programming fundamentals, pointers, arrays, and system-level programming.'
                    },
                    {
                        id: 'csharp',
                        title: 'C#',
                        icon: '🔷',
                        description: 'Test your C# knowledge including .NET framework, LINQ, and modern C# features.'
                    }
                ]
            },
            'dsa': {
                icon: '🔗',
                name: 'Data Structures & Algorithms',
                title: 'Master DSA Concepts',
                subtitle: 'Test your problem-solving skills with core computer science concepts',
                subtopics: [
                    {
                        id: 'arrays',
                        title: 'Arrays',
                        icon: '📊',
                        description: 'Test your knowledge of array operations, searching, sorting, and manipulation techniques.'
                    },
                    {
                        id: 'linked-lists',
                        title: 'Linked Lists',
                        icon: '🔗',
                        description: 'Challenge yourself with linked list operations, traversal, and implementation problems.'
                    },
                    {
                        id: 'stacks-queues',
                        title: 'Stacks & Queues',
                        icon: '📚',
                        description: 'Evaluate your understanding of stack and queue operations and their applications.'
                    },
                    {
                        id: 'trees',
                        title: 'Trees',
                        icon: '🌳',
                        description: 'Test your knowledge of binary trees, BST, tree traversals, and tree algorithms.'
                    },
                    {
                        id: 'graphs',
                        title: 'Graphs',
                        icon: '🕸️',
                        description: 'Challenge yourself with graph algorithms, traversal methods, and shortest path problems.'
                    },
                    {
                        id: 'sorting',
                        title: 'Sorting Algorithms',
                        icon: '🔄',
                        description: 'Master different sorting techniques and understand their time and space complexities.'
                    }
                ]
            },
            'webdev': {
                icon: '🌐',
                name: 'Web Development',
                title: 'Web Technologies Quiz',
                subtitle: 'Test your frontend and backend web development knowledge',
                subtopics: [
                    {
                        id: 'html',
                        title: 'HTML',
                        icon: '🏗️',
                        description: 'Test your HTML knowledge including semantic elements, forms, and accessibility.'
                    },
                    {
                        id: 'css',
                        title: 'CSS',
                        icon: '🎨',
                        description: 'Challenge yourself with CSS selectors, layouts, animations, and responsive design.'
                    },
                    {
                        id: 'react',
                        title: 'React',
                        icon: '⚛️',
                        description: 'Evaluate your React skills including components, hooks, and state management.'
                    },
                    {
                        id: 'nodejs',
                        title: 'Node.js',
                        icon: '🟢',
                        description: 'Test your server-side JavaScript knowledge and Node.js ecosystem understanding.'
                    },
                    {
                        id: 'apis',
                        title: 'REST APIs',
                        icon: '🔌',
                        description: 'Challenge yourself with API design principles, HTTP methods, and best practices.'
                    }
                ]
            },
            'database': {
                icon: '🗄️',
                name: 'Database Management',
                title: 'Database Quiz',
                subtitle: 'Test your database design and query skills',
                subtopics: [
                    {
                        id: 'sql',
                        title: 'SQL',
                        icon: '📝',
                        description: 'Test your SQL query skills including joins, subqueries, and database operations.'
                    },
                    {
                        id: 'mysql',
                        title: 'MySQL',
                        icon: '🐬',
                        description: 'Challenge yourself with MySQL-specific features and optimization techniques.'
                    },
                    {
                        id: 'mongodb',
                        title: 'MongoDB',
                        icon: '🍃',
                        description: 'Evaluate your NoSQL knowledge and MongoDB query and aggregation skills.'
                    },
                    {
                        id: 'database-design',
                        title: 'Database Design',
                        icon: '🏗️',
                        description: 'Test your understanding of normalization, ER diagrams, and schema design.'
                    }
                ]
            },
            'system-design': {
                icon: '🏗️',
                name: 'System Design',
                title: 'System Architecture Quiz',
                subtitle: 'Test your knowledge of scalable system design principles',
                subtopics: [
                    {
                        id: 'scalability',
                        title: 'Scalability',
                        icon: '📈',
                        description: 'Test your understanding of horizontal and vertical scaling techniques.'
                    },
                    {
                        id: 'caching',
                        title: 'Caching',
                        icon: '💾',
                        description: 'Challenge yourself with caching strategies and distributed cache systems.'
                    },
                    {
                        id: 'microservices',
                        title: 'Microservices',
                        icon: '🔧',
                        description: 'Evaluate your knowledge of microservice architecture and design patterns.'
                    },
                    {
                        id: 'load-balancing',
                        title: 'Load Balancing',
                        icon: '⚖️',
                        description: 'Test your understanding of load balancer types and distribution algorithms.'
                    }
                ]
            },
            'networking': {
                icon: '🌐',
                name: 'Computer Networks',
                title: 'Networking Quiz',
                subtitle: 'Test your networking protocols and communication knowledge',
                subtopics: [
                    {
                        id: 'tcp-ip',
                        title: 'TCP/IP',
                        icon: '🔗',
                        description: 'Test your knowledge of TCP/IP protocol suite and network communication.'
                    },
                    {
                        id: 'http',
                        title: 'HTTP/HTTPS',
                        icon: '🌐',
                        description: 'Challenge yourself with HTTP methods, status codes, and security protocols.'
                    },
                    {
                        id: 'osi-model',
                        title: 'OSI Model',
                        icon: '📚',
                        description: 'Evaluate your understanding of the seven-layer OSI networking model.'
                    },
                    {
                        id: 'security',
                        title: 'Network Security',
                        icon: '🔒',
                        description: 'Test your knowledge of network security protocols and best practices.'
                    }
                ]
            }
        };

        // Get current topic from URL parameters or default to programming
        function getCurrentTopic() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('topic') || 'programming';
        }

        // Load and display subtopics based on current topic
        function loadSubtopics() {
            const currentTopic = getCurrentTopic();
            const topicData = topicsData[currentTopic];
            
            if (!topicData) {
                showEmptyState();
                return;
            }

            // Update header information
            document.getElementById('currentTopicName').textContent = topicData.name;
            document.getElementById('topicIcon').textContent = topicData.icon;
            document.getElementById('topicBadgeText').textContent = topicData.name;
            document.getElementById('pageTitle').textContent = topicData.title;
            document.getElementById('pageSubtitle').textContent = topicData.subtitle;

            // Generate subtopic cards
            const container = document.getElementById('subtopicsContainer');
            container.innerHTML = '';

            topicData.subtopics.forEach((subtopic, index) => {
                const card = createSubtopicCard(subtopic, index);
                container.appendChild(card);
            });

            // Hide empty state
            document.getElementById('emptyState').style.display = 'none';
        }

        // Create individual subtopic card
        function createSubtopicCard(subtopic, index) {
            const card = document.createElement('div');
            card.className = 'subtopic-card';
            card.style.animationDelay = `${(index + 1) * 0.1}s`;
            
            card.innerHTML = `
                <div class="subtopic-icon">${subtopic.icon}</div>
                <h3 class="subtopic-title">${subtopic.title}</h3>
                <p class="subtopic-description">${subtopic.description}</p>
                <button class="subtopic-btn" onclick="startQuiz('${subtopic.id}')">Sub Topics</button>
            `;
            
            // Add click event for the entire card
            card.addEventListener('click', (e) => {
                if (!e.target.classList.contains('subtopic-btn')) {
                    startQuiz(subtopic.id);
                }
            });
            
            return card;
        }

        // Show empty state when no subtopics available
        function showEmptyState() {
            document.getElementById('subtopicsContainer').innerHTML = '';
            document.getElementById('emptyState').style.display = 'block';
            
            // Update header with generic information
            document.getElementById('pageTitle').textContent = 'No Quizzes Available';
            document.getElementById('pageSubtitle').textContent = 'This topic is currently being prepared';
        }

        // Start quiz function
        function startQuiz(subtopicId) {
            // Add click animation
            event.target.style.transform = 'scale(0.95)';
            
            setTimeout(() => {
                const currentTopic = getCurrentTopic();
                console.log(`Starting quiz for topic: ${currentTopic}, subtopic: ${subtopicId}`);
                
                // This is where you'll navigate to the quiz page
            window.location.href = `quizzes.html?topic=${currentTopic}&subtopic=${subtopicId}`;
                
                alert(`Starting ${subtopicId} quiz!\n\nThis will redirect to the quiz page when implemented.`);
            }, 150);
        }

        // Go back function
        function goBack() {
            // You can either go back in history or redirect to topics page
            if (document.referrer.includes('topics.html') || window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'topics.html';
            }
        }

        // Theme Toggle Functionality
        document.addEventListener('DOMContentLoaded', () => {
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');

            // Load saved theme or default to dark
            const savedTheme = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            themeIcon.textContent = savedTheme === 'dark' ? '☀️' : '🌙';

            themeToggle.addEventListener('click', () => {
                const currentTheme = document.documentElement.getAttribute('data-theme');
                const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
                
                document.documentElement.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                themeIcon.textContent = newTheme === 'dark' ? '☀️' : '🌙';
            });

            // Load subtopics for current topic
            loadSubtopics();
        });

        // Handle browser back/forward navigation
        window.addEventListener('popstate', () => {
            loadSubtopics();
        });

        // Smooth loading animation
        window.addEventListener('load', () => {
            document.body.style.opacity = '0';
            setTimeout(() => {
                document.body.style.transition = 'opacity 0.5s ease';
                document.body.style.opacity = '1';
            }, 100);
        });
    </script>
</body>
</html>
