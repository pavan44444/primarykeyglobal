<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>Quizzes</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f0f23, #0d47a1);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 20px;
    }

    .main-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 10px;
      background: linear-gradient(45deg, #64b5f6, #42a5f5);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 0.9rem;
      opacity: 0.7;
      margin-bottom: 30px;
    }

    .breadcrumb-separator {
      color: #64b5f6;
    }

    .concepts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
      gap: 24px;
      margin-bottom: 40px;
    }

    .concept-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .concept-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #64b5f6, #42a5f5, #1e88e5);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .concept-card:hover {
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    .concept-card:hover::before {
      opacity: 1;
    }

    .concept-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .concept-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #64b5f6;
    }

    .difficulty-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .difficulty-beginner {
      background: rgba(76, 175, 80, 0.2);
      color: #81c784;
      border: 1px solid rgba(76, 175, 80, 0.3);
    }

    .difficulty-intermediate {
      background: rgba(255, 193, 7, 0.2);
      color: #ffb74d;
      border: 1px solid rgba(255, 193, 7, 0.3);
    }

    .difficulty-advanced {
      background: rgba(244, 67, 54, 0.2);
      color: #e57373;
      border: 1px solid rgba(244, 67, 54, 0.3);
    }

    .concept-description {
      font-size: 0.95rem;
      line-height: 1.6;
      opacity: 0.8;
      margin-bottom: 20px;
    }

    .quiz-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }

    .stat-item {
      text-align: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #64b5f6;
      display: block;
      margin-bottom: 4px;
    }

    .stat-label {
      font-size: 0.8rem;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quiz-button {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(45deg, #1e88e5, #42a5f5);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .quiz-button:hover {
      background: linear-gradient(45deg, #1565c0, #1e88e5);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30, 136, 229, 0.4);
    }

    .quiz-button:active {
      transform: translateY(-1px);
    }

    .topics-overview {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 30px;
    }

    .overview-title {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 16px;
      color: #64b5f6;
    }

    .overview-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .overview-stat {
      text-align: center;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
    }

    .overview-stat-number {
      font-size: 2rem;
      font-weight: 700;
      color: #42a5f5;
      display: block;
      margin-bottom: 8px;
    }

    .overview-stat-label {
      font-size: 0.9rem;
      opacity: 0.8;
    }

    @media (max-width: 768px) {
      .concepts-grid {
        grid-template-columns: 1fr;
      }
      
      .quiz-stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      
      .overview-stats {
        grid-template-columns: 1fr;
      }
      
      .main-title {
        font-size: 2rem;
      }
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-decoration: none;
      border-radius: 10px;
      transition: all 0.3s ease;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    .back-button:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateX(-2px);
    }
  </style>
</head>

    // Get URL parameters
    function getUrlParams() {
      const urlParams = new URLSearchParams(window.location.search);
      return {
        topic: urlParams.get('topic') || 'web-development',
        subtopic: urlParams.get('subtopic') || 'javascript'
      };
    }

    // Format text for display
    function formatText(text) {
      return text.replaceAll('-', ' ').replace(/\b\w/g, l => l.toUpperCase());
    }

    // Generate random college statistics
    function generateCollegeStats(baseAttempts) {
      const colleges = [
        'MIT', 'Stanford', 'Harvard', 'Berkeley', 'CMU', 'Georgia Tech', 
        'Caltech', 'University of Washington', 'UIUC', 'UT Austin'
      ];
      const randomCollege = colleges[Math.floor(Math.random() * colleges.length)];
      const collegeUsers = Math.floor(baseAttempts * (0.1 + Math.random() * 0.3));
      return { college: randomCollege, users: collegeUsers };
    }

    // Load and display concepts
    function loadConcepts() {
      const { topic, subtopic } = getUrlParams();
      
      // Update page title and breadcrumb
      document.title = `${formatText(subtopic)} Quizzes - ${formatText(topic)}`;
      document.getElementById('quizHeading').textContent = `${formatText(subtopic)} Quizzes`;
      document.getElementById('topicBreadcrumb').textContent = formatText(topic);
      document.getElementById('subtopicBreadcrumb').textContent = formatText(subtopic);

      // Get concepts for the current topic and subtopic
      const concepts = topicConcepts[topic]?.[subtopic] || [];
      
      // Update overview statistics
      const totalAttempts = concepts.reduce((sum, concept) => sum + concept.attempts, 0);
      const avgScore = Math.round(concepts.reduce((sum, concept) => sum + concept.avgScore, 0) / concepts.length);
      const activeUsers = Math.floor(totalAttempts * 0.15);

      document.getElementById('totalConcepts').textContent = concepts.length;
      document.getElementById('totalAttempts').textContent = totalAttempts.toLocaleString();
      document.getElementById('avgScore').textContent = `${avgScore}%`;
      document.getElementById('activeUsers').textContent = activeUsers;

      // Generate concept cards
      const conceptsGrid = document.getElementById('conceptsGrid');
      conceptsGrid.innerHTML = '';

      concepts.forEach((concept, index) => {
        const collegeStats = generateCollegeStats(concept.attempts);
        
        const conceptCard = document.createElement('div');
        conceptCard.className = 'concept-card';
        conceptCard.innerHTML = `
          <div class="concept-header">
            <h3 class="concept-title">${concept.title}</h3>
            <span class="difficulty-badge difficulty-${concept.difficulty}">${concept.difficulty}</span>
          </div>
          
          <p class="concept-description">${concept.description}</p>
          
          <div class="quiz-stats">
            <div class="stat-item">
              <span class="stat-number">${concept.duration}</span>
              <span class="stat-label">Minutes</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">${concept.questions}</span>
              <span class="stat-label">Questions</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">${concept.attempts}</span>
              <span class="stat-label">Attempts</span>
            </div>
          </div>
          
          <div class="quiz-stats">
            <div class="stat-item">
              <span class="stat-number">${concept.avgScore}%</span>
              <span class="stat-label">Avg Score</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">${collegeStats.users}</span>
              <span class="stat-label">${collegeStats.college} Users</span>
            </div>
            <div class="stat-item">
              <span class="stat-number">${Math.floor(concept.attempts * 0.8)}</span>
              <span class="stat-label">Completed</span>
            </div>
          </div>
          
          <button class="quiz-button" onclick="startQuiz('${concept.title}', ${index})">
            Take Quiz
          </button>
        `;
        
        conceptsGrid.appendChild(conceptCard);
      });
    }

    // Start quiz function
    function startQuiz(conceptTitle, index) {
      const { topic, subtopic } = getUrlParams();
      alert(`Starting quiz: "${conceptTitle}"\n\nTopic: ${formatText(topic)}\nSubtopic: ${formatText(subtopic)}\n\nThis would redirect to the quiz page with the selected concept.`);
      
      // In a real application, you would redirect to the quiz page:
       window.location.href = `quizinterface.html?topic=${topic}&subtopic=${subtopic}&concept=${index}`;
    }

    // Initialize the page
    document.addEventListener('DOMContentLoaded', loadConcepts);
    document.getElementById('startMainQuizBtn').addEventListener('click', function () {
  const { topic, subtopic } = getUrlParams();
  const concepts = topicConcepts[topic]?.[subtopic] || [];

  if (concepts.length > 0) {
    // Redirect to first quiz
    window.location.href = `quizinterface.html?topic=${topic}&subtopic=${subtopic}&concept=0`;
  } else {
    alert("No quizzes available for this topic.");
  }
});
